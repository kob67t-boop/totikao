<style>
  :root{
    --paper:#F5F1E6;
    --paper-line:#DAD3BF;
    --ink:#1E2A38;
    --ink-soft:#3C4A5C;
    --stake:#B5472B;
    --stake-dark:#8F3620;
    --tape:#2E6E5E;
    --tape-dark:#1F4F43;
    --card:#FBF9F2;
    --gold:#B7902F;
    --danger:#A9312B;
    --bg:#2B2B30;
    --on-bg-soft:#A9A9B4;
    --on-bg:#D8D8DE;
    --font-mincho:'Hiragino UD Mincho StdN','ヒラギノUD明朝 StdN','Hiragino UD Mincho','ヒラギノUD明朝','Hiragino Mincho ProN','ヒラギノ明朝 ProN','Shippori Mincho','Noto Serif JP', serif;
    --bright-ink:#4285F4;
    --bright-tape:#34A853;
    --bright-stake:#EA4335;
    --bright-gold:#FBBC05;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-mincho);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .serif{font-family:var(--font-mincho);}

  .ruler{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:#EDE6D4;
    padding:10px 0 0 0;
    box-shadow:0 2px 0 var(--stake);
  }
  .ruler-track{
    display:flex; align-items:flex-end; height:22px;
    overflow:hidden; padding:0 10px;
  }
  .tick{flex:0 0 auto; width:27px; text-align:left; position:relative; height:100%;}
  .tick::before{
    content:''; position:absolute; left:0; bottom:0; width:1px; background:#8C8368; height:8px;
  }
  .tick.major::before{height:14px; background:#EDE6D4;}
  .tick.major .num{
    position:absolute; left:2px; bottom:14px; font-size:9px; color:#B7AE93; letter-spacing:0.5px;
  }
  .ruler-title{
    max-width:640px; margin:0 auto; padding:10px 20px 14px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .ruler-title h1{
    font-size:19px; margin:0; font-weight:700; letter-spacing:1px; color:#F4EFDF;
  }
  .ruler-title .tag{
    font-size:11px; color:var(--stake); border:1px solid var(--stake); padding:2px 8px; border-radius:2px; letter-spacing:1px;
  }

  .wrap{max-width:640px; margin:0 auto; padding:24px 20px 80px;}

  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:50%;
    border:2px solid var(--stake); color:var(--stake);
    font-family:var(--font-mincho); font-weight:800; font-size:13px;
    transform:rotate(-8deg);
    flex:0 0 auto;
  }

  .home-hero{display:flex; align-items:center; gap:16px; margin-bottom:28px;}
  .home-hero .lede{font-size:13px; color:var(--on-bg-soft); line-height:1.7; margin-top:4px;}

  .card{
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--ink);
    padding:18px 18px; margin-bottom:14px; position:relative;
  }
  .card.stake-left{border-left-color:var(--stake);}
  .card.tape-left{border-left-color:var(--tape);}
  .card.gold-left{border-left-color:var(--gold);}

  .mode-btn{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--ink);
    padding:16px 18px; margin-bottom:12px; font-family:inherit; color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .mode-btn:hover{transform:translateX(2px); box-shadow:3px 3px 0 rgba(30,42,56,0.08);}
  .mode-btn .m-title{font-family:var(--font-mincho); font-size:17px; font-weight:700;}
  .mode-btn .m-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .mode-btn .m-arrow{font-size:20px; color:var(--stake);}
  .mode-btn.year{border-left-color:var(--bright-ink);}
  .mode-btn.review{border-left-color:var(--bright-tape);}
  .mode-btn.attack{border-left-color:var(--bright-stake);}
  .mode-btn.admin{border-left-color:var(--bright-gold);}
  .mode-btn.tape{border-left-color:var(--bright-gold);}

  /* 年度順モード：肢ごとの履歴表示 */
  .year-hist-row{background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--ink); margin-bottom:12px;}
  .year-hist-head{display:flex; align-items:center; gap:8px; padding:14px 16px;}
  .year-hist-toggle{
    flex:1; display:flex; align-items:baseline; gap:10px; background:none; border:none; cursor:pointer;
    font-family:inherit; color:var(--ink); text-align:left; padding:0; min-width:0;
  }
  .year-hist-toggle .tri{color:var(--stake); font-size:11px; flex:0 0 auto;}
  .year-hist-toggle .m-title{font-size:16px;}
  .year-hist-toggle .m-sub{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .year-hist-body{padding:0 16px 16px;}
  .daimon-hist{margin-bottom:12px;}
  .daimon-hist-title{font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-family:'JetBrains Mono',monospace;}
  .eda-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .eda-pill{
    width:44px; height:40px; border-radius:8px; border:1.5px solid var(--paper-line);
    background:#fff; color:var(--ink-soft); font-family:var(--font-mincho); font-weight:700; font-size:15px;
    cursor:pointer; transition:transform .1s ease;
  }
  .eda-pill:hover{transform:translateY(-1px);}
  .eda-pill.correct{background:#EAF3EF; border-color:var(--tape); color:var(--tape-dark);}
  .eda-pill.wrong{background:#F6EAE9; border-color:var(--danger); color:var(--danger);}
  .eda-pill.current{box-shadow:0 0 0 2px var(--stake);}

  /* 学習ログ（カレンダー） */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-month{font-size:16px; font-weight:700; color:var(--on-bg);}
  .cal-summary{font-size:12.5px; color:var(--on-bg-soft); margin-bottom:14px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
  .cal-grid.cal-head{margin-bottom:6px; font-size:11px; color:var(--on-bg-soft); text-align:center;}
  .cal-cell{
    aspect-ratio:1; background:var(--card); border:1px solid var(--paper-line); border-radius:6px;
    padding:4px 6px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .cal-cell.empty{background:transparent; border:none;}
  .cal-cell .cal-day{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .cal-cell .cal-count{font-size:13px; font-weight:700; color:var(--ink); text-align:right; font-family:'JetBrains Mono',monospace;}
  .cal-cell.today{border-color:var(--stake); border-width:2px;}
  .cal-cell.lv1{background:#DCEEE7;}
  .cal-cell.lv2{background:#A9D8C4;}
  .cal-cell.lv3{background:#5FB690;}
  .cal-cell.lv4{background:var(--tape-dark);}
  .cal-cell.lv3 .cal-day, .cal-cell.lv3 .cal-count, .cal-cell.lv4 .cal-day, .cal-cell.lv4 .cal-count{color:#F4EFDF;}

  .foot-note{
    font-size:11px; color:var(--on-bg-soft); line-height:1.8; margin-top:32px;
    border-top:1px dashed rgba(255,255,255,0.15); padding-top:16px;
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
  .back{
    background:none; border:none; color:var(--on-bg-soft); font-family:inherit; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:6px; padding:6px 0;
  }
  .progress-pill{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink);
    background:#EDE7D6; border:1px solid var(--paper-line); padding:4px 10px; border-radius:20px;
  }
  .timer{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; color:var(--ink); transition:color .1s ease, transform .1s ease;}
  .timer.low{color:var(--danger);}
  .timer.penalty{color:var(--danger); transform:scale(1.15); animation:timerShake .35s ease;}
  @keyframes timerShake{
    0%{transform:scale(1);} 30%{transform:scale(1.2);} 100%{transform:scale(1.15);}
  }
  .floating-timer{
    position:fixed; top:64px; right:14px; z-index:40;
    background:var(--ink); color:#F4EFDF; padding:8px 16px; border-radius:22px;
    box-shadow:0 3px 10px rgba(0,0,0,0.28); border:1px solid rgba(244,239,223,0.15);
  }
  .floating-timer.low{color:#FF9A8A;}
  .floating-timer.penalty{color:#FF9A8A;}

  .q-card{
    background:var(--card); border:1px solid var(--paper-line);
    padding:22px 20px 24px; position:relative; margin-bottom:16px;
  }
  .q-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 14px);
  }
  .q-card.no-dash::before{display:none;}
  .q-meta{font-size:11px; color:var(--stake); letter-spacing:1px; margin-bottom:10px; font-family:'JetBrains Mono',monospace;}
  .q-text{font-size:16.5px; line-height:1.9; white-space:pre-wrap;}

  /* ○× choice buttons */
  .ox-row{display:flex; gap:14px; margin-bottom:6px;}
  .ox-btn{
    flex:1; cursor:pointer; font-family:var(--font-mincho); font-weight:800;
    background:var(--card); border:2px solid var(--ink); color:var(--ink);
    padding:26px 0; font-size:44px; line-height:1; text-align:center;
    transition:transform .1s ease, background .1s ease, border-color .1s ease;
  }
  .ox-btn:hover{transform:translateY(-2px); box-shadow:3px 3px 0 rgba(30,42,56,0.12);}
  .ox-btn.maru{color:var(--tape); border-color:var(--tape);}
  .ox-btn.batsu{color:var(--stake); border-color:var(--stake);}
  .ox-btn:disabled{cursor:default;}
  .ox-btn:disabled:hover{transform:none; box-shadow:none;}
  .ox-btn.correct{background:#EAF3EF; border-color:var(--tape); color:var(--tape-dark); box-shadow:0 0 0 3px rgba(46,110,94,0.15) inset;}
  .ox-btn.wrong{background:#F6EAE9; border-color:var(--danger); color:var(--danger); box-shadow:0 0 0 3px rgba(169,49,43,0.15) inset;}
  .ox-btn .sub{display:block; font-family:var(--font-mincho); font-size:11px; font-weight:500; letter-spacing:2px; margin-top:4px;}

  .feedback{margin-top:14px; padding:14px 16px; border:1px solid var(--paper-line); background:var(--card); font-size:13.5px; line-height:1.8;}
  .feedback.ok{border-color:var(--tape); color:var(--tape-dark);}
  .feedback.ng{border-color:var(--danger); color:var(--danger);}
  .feedback .exp{color:var(--ink-soft); margin-top:8px; font-size:13px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--ink); color:#F4EFDF; border:none; padding:12px 22px;
    font-family:var(--font-mincho); font-weight:700; font-size:14.5px; letter-spacing:1px;
    cursor:pointer; transition:transform .1s ease, background .1s ease;
  }
  .btn:hover{transform:translateY(-1px); background:var(--ink-soft);}
  .btn.primary{background:var(--stake);}
  .btn.primary:hover{background:var(--stake-dark);}
  .btn.tape{background:var(--tape);}
  .btn.tape:hover{background:var(--tape-dark);}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn.small{padding:8px 14px; font-size:12.5px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  .btn-row{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-soft); background:var(--card); border:1px solid var(--paper-line);}
  .empty .big{font-family:var(--font-mincho); font-size:20px; color:var(--ink); margin-bottom:8px;}

  .admin-list-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--gold);
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .admin-list-item:hover{border-color:var(--gold);}
  .admin-list-item .ai-text{font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .admin-list-item .ai-ans{
    font-family:var(--font-mincho); font-weight:800; font-size:15px; flex:0 0 auto; width:24px; text-align:center;
  }
  .admin-list-item .ai-ans.maru{color:var(--tape);}
  .admin-list-item .ai-ans.batsu{color:var(--stake);}
  .admin-list-item .ai-meta{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; flex:0 0 auto;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:0.5px;}
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%; font-family:inherit; font-size:14px; padding:10px 11px;
    border:1px solid var(--paper-line); background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px; line-height:1.6;}

  .ox-toggle{display:flex; gap:10px;}
  .ox-toggle label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    border:1.5px solid var(--paper-line); padding:10px; cursor:pointer; font-family:var(--font-mincho); font-weight:700; font-size:16px;
  }
  .ox-toggle input{accent-color:var(--tape); width:16px; height:16px;}
  .ox-toggle label.active-maru{border-color:var(--tape); color:var(--tape); background:#EAF3EF;}
  .ox-toggle label.active-batsu{border-color:var(--stake); color:var(--stake); background:#F6EAE9;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#F4EFDF; padding:10px 18px; font-size:13px;
    border-left:4px solid var(--tape); z-index:50; box-shadow:0 4px 14px rgba(0,0,0,0.2); max-width:88vw; text-align:center;
  }
  .danger-link{color:#E2695C; background:none; border:none; font-family:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0;}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(30,42,56,0.55); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--card); border:1px solid var(--paper-line); border-top:4px solid var(--tape);
    padding:22px 20px; max-width:360px; width:100%; box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .modal-box .m-title{font-family:var(--font-mincho); font-weight:700; font-size:16px; margin-bottom:8px;}
  .modal-box .m-msg{font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:18px;}
  .modal-box .m-btns{display:flex; flex-direction:column; gap:8px;}
  .modal-box .m-btns .btn{width:100%;}

  /* bulk import */
  .import-box textarea{width:100%; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.7; min-height:220px; padding:12px; border:1px solid var(--paper-line);}
  .parsed-item{
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--gold);
    padding:12px 14px; margin-bottom:10px;
  }
  .parsed-item .p-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
  .parsed-item .p-text{font-size:13.5px; line-height:1.7; white-space:pre-wrap;}
  .parsed-item textarea{width:100%; font-family:inherit; font-size:13.5px; padding:8px; border:1px solid var(--paper-line); min-height:52px;}
  .parsed-item select, .parsed-item input[type=number]{font-family:inherit; font-size:13px; padding:5px 7px; border:1px solid var(--paper-line);}
  .parsed-item .p-remove{font-size:11px; color:var(--danger); background:none; border:none; cursor:pointer; text-decoration:underline;}
  .parsed-item .p-flag{font-size:10.5px; color:var(--stake); letter-spacing:0.5px; margin-bottom:4px;}
  .hint{font-size:11.5px; color:var(--ink-soft); line-height:1.8;}

  @media (max-width:420px){
    .ruler-title h1{font-size:16px;}
    .ox-btn{font-size:34px; padding:20px 0;}
  }
</style>
</head>
<body>

<div class="ruler">
  <div class="ruler-track" id="rulerTrack"></div>
  <div class="ruler-title">
    <h1>土地家屋調査士 過去問クイズ帳</h1>
    <span class="tag">FIELD NOTE ed.</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ---------------- ruler decoration ---------------- */
(function(){
  const track = document.getElementById('rulerTrack');
  let html = '';
  for(let i=0;i<40;i++){
    const major = i % 5 === 0;
    html += `<div class="tick ${major?'major':''}">${major?`<span class="num">${i}</span>`:''}</div>`;
  }
  track.innerHTML = html;
})();

/* ---------------- sample data (○×形式) ----------------
   サンプルはダミーです。実際の過去問は「問題を管理する」→「まとめて貼り付けて取り込む」
   から、参考サイトのテキストをコピーして自動取り込みしてください。
------------------------------------------------- */
const SAMPLE_QUESTIONS = [
  { id:'s1', year:2023, category:'午前の部(サンプル)', text:'表示に関する登記は、登記官が職権で行うことができる場合がある。（サンプル問題）', answer:true,
    explanation:'サンプル解説です。実際の解説文に差し替えてください。' },
  { id:'s2', year:2023, category:'午前の部(サンプル)', text:'土地の分筆登記の申請には、地積測量図を提供する必要はない。（サンプル問題）', answer:false,
    explanation:'サンプル解説です。実際の条文・先例に基づく解説に差し替えてください。' },
  { id:'s3', year:2022, category:'午後の部(サンプル)', text:'建物の表題登記は、所有権を取得した日から1か月以内に申請しなければならない。（サンプル問題）', answer:true,
    explanation:'サンプル解説文です。編集画面から本文に差し替えてください。' },
  { id:'s4', year:2021, category:'午後の部(サンプル)', text:'筆界特定は、筆界特定登記官ではなく裁判所が行う。（サンプル問題）', answer:false,
    explanation:'サンプル解説文です。編集画面から本文に差し替えてください。' }
];

/* ---------------- storage helpers ----------------
   このアプリをGitHub Pagesなどで公開して使うことを想定し、
   ブラウザのlocalStorageに保存します（アプリを更新しても、
   スマホ側に保存された問題データは消えません）。
   Claudeのプレビュー環境などでwindow.storageが使える場合はそちらを優先します。
------------------------------------------------------- */
const HAS_CLAUDE_STORAGE = (typeof window !== 'undefined' && !!window.storage);

async function storeGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ const res = await window.storage.get(key); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storeSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key, value); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}

async function loadQuestions(){
  try{
    const v = await storeGet('questions');
    if(v) return JSON.parse(v);
  }catch(e){}
  return SAMPLE_QUESTIONS.slice();
}
async function saveQuestions(qs){ await storeSet('questions', JSON.stringify(qs)); }
async function loadProgress(){
  try{
    const v = await storeGet('progress');
    if(v){
      const p = JSON.parse(v);
      if(!p.reviewSet) p.reviewSet = {}; // 旧バージョンからの互換
      if(!p.streaks) p.streaks = {};
      if(!p.yearProgress) p.yearProgress = {}; // 旧バージョン（yearIndexのみ）からの互換
      if(!p.answered) p.answered = {}; // 旧バージョンからの互換（肢ごとの履歴表示用）
      if(!p.lapAnswered) p.lapAnswered = {}; // 旧バージョンからの互換（タイムアタックの周回トラッキング用）
      if(!p.dailyLog) p.dailyLog = {}; // 旧バージョンからの互換（学習ログ用）
      return p;
    }
  }catch(e){}
  return { streaks:{}, reviewSet:{}, yearProgress:{}, answered:{}, lapAnswered:{}, dailyLog:{}, taScores:[] };
}
async function saveProgress(p){ await storeSet('progress', JSON.stringify(p)); }


/* ---------------- app state ---------------- */
let QUESTIONS = [];
let PROGRESS = { streaks:{}, reviewSet:{}, yearProgress:{}, answered:{}, lapAnswered:{}, dailyLog:{}, taScores:[] };
let view = 'home';
let quizState = null;

const app = document.getElementById('app');

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function showModal(title, msg, buttons){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="m-title serif">${esc(title)}</div>
    <div class="m-msg">${esc(msg)}</div>
    <div class="m-btns" id="modalBtns"></div>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const btnZone = box.querySelector('#modalBtns');
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = `btn ${b.className||'ghost'}`;
    btn.textContent = b.label;
    btn.onclick = ()=>{ overlay.remove(); if(b.onClick) b.onClick(); };
    btnZone.appendChild(btn);
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 西暦→和暦（表示用）。内部データは西暦のまま保持する
function toWareki(year){
  if(year >= 2019){ const n = year - 2018; return n===1 ? '令和元' : `令和${n}`; }
  if(year >= 1989){ const n = year - 1988; return n===1 ? '平成元' : `平成${n}`; }
  if(year >= 1926){ const n = year - 1925; return n===1 ? '昭和元' : `昭和${n}`; }
  return `${year}`;
}
// 年度が未設定（null）の問題は「オリジナル問題」として扱う
function yearLabel(year){
  if(year===null || year===undefined || isNaN(year)) return 'オリジナル';
  return `${toWareki(year)}年度`;
}
// 年度でソートする際、オリジナル問題（null）は末尾に回す
function yearSortVal(year){
  return (year===null || year===undefined || isNaN(year)) ? Infinity : year;
}
// Dateオブジェクト → "YYYY-MM-DD"（学習ログのキー、ローカル日付基準）
function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ---------------- 学習ログ（カレンダー） ---------------- */
let calMonthOffset = 0; // 今月からのオフセット（0=今月, -1=先月...）

function renderCalendar(){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + calMonthOffset, 1);
  const y = base.getFullYear();
  const m = base.getMonth(); // 0-11
  const firstWeekday = new Date(y, m, 1).getDay(); // 0=日
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayKey = dateKey(now);

  const entries = Object.entries(PROGRESS.dailyLog).filter(([k])=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));
  const monthTotal = entries.reduce((sum,[,c])=>sum+c, 0);
  const activeDays = entries.filter(([,c])=>c>0).length;

  function intensityClass(count){
    if(!count) return '';
    if(count < 5) return 'lv1';
    if(count < 15) return 'lv2';
    if(count < 30) return 'lv3';
    return 'lv4';
  }

  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = PROGRESS.dailyLog[key] || 0;
    const isToday = key===todayKey;
    cells += `
      <div class="cal-cell ${intensityClass(count)} ${isToday?'today':''}">
        <div class="cal-day">${d}</div>
        ${count ? `<div class="cal-count">${count}</div>` : ''}
      </div>`;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← ホームへ</button>
    </div>
    <div class="card gold-left" style="margin-bottom:16px;">
      <div class="m-title serif" style="font-size:16px; margin-bottom:4px;">学習ログ</div>
      <div style="font-size:12.5px; color:var(--ink-soft);">その日に解いた問題数（全モード合計）をカレンダーで確認できます。</div>
    </div>
    <div class="cal-nav">
      <button class="btn ghost small" id="calPrev">← 前月</button>
      <div class="cal-month serif">${y}年 ${m+1}月</div>
      <button class="btn ghost small" id="calNext">次月 →</button>
    </div>
    <div class="cal-summary mono">今月の合計 ${monthTotal}問 ／ 学習日数 ${activeDays}日</div>
    <div class="cal-grid cal-head">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="cal-grid">${cells}</div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ view='home'; renderHome(); };
  document.getElementById('calPrev').onclick = ()=>{ calMonthOffset--; renderCalendar(); };
  document.getElementById('calNext').onclick = ()=>{ calMonthOffset++; renderCalendar(); };
}

// 「R7-1-ア」のようにIDに年度情報が含まれている場合、年度表示を重複させない
function metaLabel(q){
  const catHasYear = q.category && /^[RHS]?\s?\d+\s?-\s?\d+/.test(q.category);
  return catHasYear ? esc(q.category) : `${yearLabel(q.year)}${q.category ? ' ／ ' + esc(q.category) : ''}`;
}

/* ---------------- render: home ---------------- */
function renderHome(){
  const reviewCount = Object.keys(PROGRESS.reviewSet).length;
  app.innerHTML = `
    <div class="home-hero">
      <div class="stamp serif">全${QUESTIONS.length}問</div>
      <div class="lede">○×形式で出題します。年度順・復習・タイムアタックの3モード。<br>「問題を管理する」から、問題文や正解を編集・追加・一括取り込みできます。</div>
    </div>

    <button class="mode-btn year" data-go="year">
      <div><div class="m-title serif">年度順モード</div><div class="m-sub">年度・問番号から肢を選んで、その場で○×解答</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn review" data-go="review">
      <div><div class="m-title serif">復習モード</div><div class="m-sub">年度順・タイムアタックで間違えた問題（${reviewCount}問）を出題。正解時に「復習完了」で卒業</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn attack" data-go="attack">
      <div><div class="m-title serif">タイムアタック（5分）</div><div class="m-sub">制限時間内に何問正解できるか。誤答で残り時間-20秒</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn tape" data-go="calendar">
      <div><div class="m-title serif">学習ログ</div><div class="m-sub">その日に解いた問題数をカレンダーで確認</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn admin" data-go="admin">
      <div><div class="m-title serif">問題を管理する</div><div class="m-sub">編集・追加・削除／まとめて貼り付けて取り込む</div></div>
      <div class="m-arrow">→</div>
    </button>

    <div class="foot-note">
      本アプリのサンプル問題はダミーです。実際の過去問は法務省「土地家屋調査士試験」の公表問題を、ご自身でコピーして取り込んでご利用ください。問題文の著作権は法務省に帰属します。
    </div>
  `;
  app.querySelectorAll('[data-go]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mode = btn.dataset.go;
      if(mode==='admin'){ view='admin'; renderAdminList(); }
      else if(mode==='year'){ renderYearPicker(); }
      else if(mode==='calendar'){ calMonthOffset = 0; view='calendar'; renderCalendar(); }
      else startQuiz(mode);
    });
  });
}

/* ---------------- 年度順モード：年度を選ぶ画面 ---------------- */
function renderYearPicker(autoExpandYear){
  const numericYears = [...new Set(QUESTIONS.filter(q=>q.year!=null && !isNaN(q.year)).map(q=>q.year))].sort((a,b)=>a-b);
  const hasOriginal = QUESTIONS.some(q=>q.year==null || isNaN(q.year));
  const years = hasOriginal ? [...numericYears, null] : numericYears;
  const totalCorrect = QUESTIONS.filter(q=>PROGRESS.answered[q.id]===true).length;
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← ホームへ</button>
      <div class="progress-pill mono">${totalCorrect} / ${QUESTIONS.length}</div>
    </div>
    <div id="yearPickerList"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ view='home'; renderHome(); };

  const listEl = document.getElementById('yearPickerList');
  if(years.length===0){
    listEl.innerHTML = `<div class="empty"><div class="big serif">問題がありません</div></div>`;
    return;
  }

  years.forEach(y=>{
    const qs = QUESTIONS.filter(q=> y===null ? (q.year==null || isNaN(q.year)) : q.year===y);
    const count = qs.length;
    const correctCount = qs.filter(q=>PROGRESS.answered[q.id]===true).length;

    const row = document.createElement('div');
    row.className = 'year-hist-row';
    row.innerHTML = `
      <div class="year-hist-head">
        <button class="year-hist-toggle" data-toggle style="flex:1;">
          <span class="tri">▶</span>
          <span class="m-title serif">${yearLabel(y)}</span>
          <span class="m-sub">正解済み ${correctCount} / ${count}</span>
        </button>
      </div>
      <div class="year-hist-body" data-body style="display:none;"></div>
    `;
    const toggleBtn = row.querySelector('[data-toggle]');
    const body = row.querySelector('[data-body]');
    let built = false;
    const openRow = ()=>{
      if(!built){
        body.innerHTML = buildYearHistoryHTML(y);
        body.querySelectorAll('.eda-pill').forEach(p=>{
          p.addEventListener('click', ()=>{
            const q = QUESTIONS.find(x=>x.id===p.dataset.qid);
            if(q) startSingleQuestion(q, ()=>renderYearPicker(y));
          });
        });
        built = true;
      }
      body.style.display = 'block';
      toggleBtn.querySelector('.tri').textContent = '▼';
    };
    toggleBtn.addEventListener('click', ()=>{
      const isOpen = body.style.display !== 'none';
      if(isOpen){
        body.style.display = 'none';
        toggleBtn.querySelector('.tri').textContent = '▶';
      } else {
        openRow();
      }
    });
    listEl.appendChild(row);
    if(autoExpandYear===y) openRow();
  });
}

// 年度順モードの履歴表示：問番号ごとに肢の○×状況をパネルで表示するHTMLを組み立てる
function buildYearHistoryHTML(year){
  const qs = QUESTIONS.filter(q=> year===null ? (q.year==null || isNaN(q.year)) : q.year===year).sort(yearDaimonEdaSort);

  const daimonMap = new Map();
  const ungrouped = [];
  qs.forEach(q=>{
    const {daimon} = parseCategoryStructure(q.category);
    if(daimon){
      if(!daimonMap.has(daimon)) daimonMap.set(daimon, []);
      daimonMap.get(daimon).push(q);
    } else {
      ungrouped.push(q);
    }
  });
  const daimonKeys = [...daimonMap.keys()].sort((a,b)=>parseInt(a,10)-parseInt(b,10));

  function pillHTML(q){
    const eda = parseCategoryStructure(q.category).eda || '−';
    const state = PROGRESS.answered[q.id];
    let cls = 'eda-pill';
    if(state===true) cls += ' correct';
    else if(state===false) cls += ' wrong';
    return `<button class="${cls}" data-qid="${q.id}" title="タップして解答">${esc(eda)}</button>`;
  }

  let html = '';
  daimonKeys.forEach(d=>{
    html += `
      <div class="daimon-hist">
        <div class="daimon-hist-title">問${d}</div>
        <div class="eda-pills">${daimonMap.get(d).map(pillHTML).join('')}</div>
      </div>`;
  });
  if(ungrouped.length){
    html += `
      <div class="daimon-hist">
        <div class="daimon-hist-title">区分なし</div>
        <div class="eda-pills">${ungrouped.map(pillHTML).join('')}</div>
      </div>`;
  }
  return html || `<div style="font-size:12.5px; color:var(--ink-soft);">問題がありません</div>`;
}

/* ---------------- quiz engine ---------------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function yearDaimonEdaSort(a, b){
  const ya = yearSortVal(a.year), yb = yearSortVal(b.year);
  if(ya !== yb) return ya - yb;
  const pa = parseCategoryStructure(a.category), pb = parseCategoryStructure(b.category);
  const na = pa.daimon ? parseInt(pa.daimon,10) : Infinity;
  const nb = pb.daimon ? parseInt(pb.daimon,10) : Infinity;
  if(na !== nb) return na - nb;
  return edaSortKey(pa.eda) - edaSortKey(pb.eda);
}
// タイムアタック用：「今の周でまだ出していない問題」を優先しつつ、それぞれの中はシャッフルする。
// 今の周を全問出し終えていたら、周回履歴をリセットして新しい周として最初からやり直す。
function shuffleLapPriority(list){
  const notThisLap = list.filter(q => !PROGRESS.lapAnswered[q.id]);
  if(notThisLap.length === 0){
    PROGRESS.lapAnswered = {};
    saveProgress(PROGRESS);
    return shuffleArray(list);
  }
  const doneThisLap = list.filter(q => PROGRESS.lapAnswered[q.id]);
  return [...shuffleArray(notThisLap), ...shuffleArray(doneThisLap)];
}
function startQuiz(mode, yearFilter){
  if(QUESTIONS.length===0){
    view='home'; renderHome();
    toast('問題が登録されていません。まず「問題を管理する」から追加してください。');
    return;
  }
  let pool, yearKey;
  if(mode==='year'){
    pool = (yearFilter ? QUESTIONS.filter(q=>q.year===yearFilter) : QUESTIONS.slice()).sort(yearDaimonEdaSort);
    yearKey = yearFilter ? String(yearFilter) : '_all';
  } else if(mode==='review'){
    pool = QUESTIONS.filter(q=>PROGRESS.reviewSet[q.id]).sort((a,b)=>yearSortVal(a.year)-yearSortVal(b.year));
    if(pool.length===0){
      view='home'; renderHome();
      toast('復習対象の問題はありません。すべて習得済みです。');
      return;
    }
  } else if(mode==='attack'){
    pool = shuffleLapPriority(QUESTIONS);
  }

  quizState = {
    mode, pool, yearKey,
    idx: (mode==='year' ? Math.min(PROGRESS.yearProgress[yearKey]||0, pool.length-1) : 0),
    answered:false, score:0, total:0, wrongList:[],
    timeLeft: mode==='attack' ? 300 : null, timerHandle: null, ended:false
  };
  view='quiz';
  renderQuiz();
  if(mode==='attack') startTimer();
}

// 年度順モードの履歴一覧から、肢を1つタップしてその場で解答するための単発クイズ
function startSingleQuestion(q, returnTo){
  quizState = {
    mode:'year', pool:[q], yearKey:null,
    idx:0, answered:false, score:0, total:0, wrongList:[],
    timeLeft:null, timerHandle:null, ended:false,
    singleReturnTo: returnTo
  };
  view='quiz';
  renderQuiz();
}

function startTimer(){
  if(quizState.timerHandle) clearInterval(quizState.timerHandle);
  quizState.timerHandle = setInterval(()=>{
    quizState.timeLeft--;
    const el = document.getElementById('taTimer');
    if(el){ el.textContent = fmtTime(quizState.timeLeft); el.classList.toggle('low', quizState.timeLeft <= 30); }
    if(quizState.timeLeft<=0){ clearInterval(quizState.timerHandle); endAttack(); }
  }, 1000);
}
function fmtTime(s){ s=Math.max(0,s); const m=Math.floor(s/60), sec=s%60; return `${m}:${String(sec).padStart(2,'0')}`; }
function endAttack(){
  if(!quizState || quizState.ended) return;
  quizState.ended = true;
  if(quizState.timerHandle) clearInterval(quizState.timerHandle);
  const total = quizState.total, score = quizState.score;
  const wrongList = quizState.wrongList;
  PROGRESS.taScores.unshift({date:new Date().toISOString(), score, total});
  PROGRESS.taScores = PROGRESS.taScores.slice(0,10);
  saveProgress(PROGRESS);

  const wrongHtml = wrongList.length === 0
    ? `<div class="card tape-left" style="margin-top:18px;"><div style="font-size:13.5px; color:var(--tape-dark);">間違えた問題はありませんでした。</div></div>`
    : `
      <div class="m-title serif" style="font-size:15px; margin:22px 0 10px;">間違えた問題（${wrongList.length}問）</div>
      ${wrongList.map(q=>`
        <div class="card stake-left">
          <div class="q-meta" style="margin-bottom:6px;">${metaLabel(q)}</div>
          <div style="font-size:14px; line-height:1.8; white-space:pre-wrap;">${esc(q.text)}</div>
          <div style="margin-top:8px; font-size:13px;">正答：<strong class="${q.answer?'':''}" style="color:${q.answer?'var(--tape-dark)':'var(--stake)'};">${q.answer?'○':'×'}</strong></div>
          ${q.explanation ? `<div style="margin-top:6px; font-size:12.5px; color:var(--ink-soft);">${esc(q.explanation)}</div>` : ''}
        </div>
      `).join('')}
    `;

  app.innerHTML = `
    <div class="empty">
      <div class="big serif">タイムアタック終了</div>
      <div class="mono" style="font-size:32px; margin:14px 0; color:var(--stake);">${total}問</div>
      <div style="font-size:13px; color:var(--ink-soft);">時間内に解答しました（正解 ${score} ／ 誤答 ${wrongList.length}）</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn primary" id="retryTa">もう一度</button>
        <button class="btn ghost" id="toHome">ホームへ</button>
      </div>
    </div>
    ${wrongHtml}
  `;
  document.getElementById('retryTa').onclick = ()=>startQuiz('attack');
  document.getElementById('toHome').onclick = ()=>{ view='home'; renderHome(); };
}

function currentQuestion(){ return quizState.pool[quizState.idx]; }

function renderQuiz(){
  const q = currentQuestion();
  if(!q){
    if(quizState.mode==='year' && quizState.yearKey){ PROGRESS.yearProgress[quizState.yearKey] = 0; saveProgress(PROGRESS); }
    if(quizState.singleReturnTo){ quizState.singleReturnTo(); return; }
    app.innerHTML = `
      <div class="empty">
        <div class="big serif">お疲れさまでした</div>
        <div style="font-size:13px;">${quizState.mode==='review' ? '復習対象の問題をすべて終えました。' : '出題範囲をすべて終えました。'}</div>
        <div class="mono" style="font-size:20px; margin:14px 0;">正答 ${quizState.score} / ${quizState.total}</div>
        <div class="btn-row" style="justify-content:center;"><button class="btn ghost" id="toHome">ホームへ</button></div>
      </div>`;
    document.getElementById('toHome').onclick = ()=>{ view='home'; renderHome(); };
    return;
  }

  const modeLabel = {year:'年度順モード', review:'復習モード', attack:'タイムアタック'}[quizState.mode];

  app.innerHTML = `
    ${quizState.mode!=='attack' ? `
    <div class="topbar">
      <div class="progress-pill">${quizState.idx+1} / ${quizState.pool.length}</div>
    </div>` : ''}
    ${quizState.mode==='attack' ? `<div class="timer mono floating-timer" id="taTimer">${fmtTime(quizState.timeLeft)}</div>` : ''}
    <div class="q-card no-dash">
      ${quizState.mode!=='attack' ? `<div class="q-meta">${modeLabel} ／ ${metaLabel(q)}</div>` : ''}
      <div class="q-text serif">${esc(q.text)}</div>
    </div>
    <div class="ox-row" id="oxRow">
      <button class="ox-btn maru" data-ans="true">○</button>
      <button class="ox-btn batsu" data-ans="false">×</button>
    </div>
    <div style="text-align:center; margin-top:10px; display:flex; justify-content:center; align-items:center; gap:18px;">
      <button class="back" id="backBtn" style="padding:0;">← ホームへ</button>
      ${quizState.mode==='attack' ? `<button class="danger-link" id="endAttackBtn" style="font-size:12px;">■ 途中終了</button>` : ''}
      ${(quizState.mode==='year' || quizState.mode==='attack') ? `<button class="danger-link" id="editQBtn" style="font-size:12px;">✎ 問題文の間違いを直す</button>` : ''}
    </div>
    <div id="feedbackZone"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{
    if(quizState.timerHandle) clearInterval(quizState.timerHandle);
    view='home'; renderHome();
  };
  document.querySelectorAll('.ox-btn').forEach(b=>{
    b.addEventListener('click', ()=>answer(b.dataset.ans === 'true'));
  });
  const endBtn = document.getElementById('endAttackBtn');
  if(endBtn) endBtn.addEventListener('click', ()=>{
    showModal('タイムアタックを終了しますか？', 'ここまでの結果を確認できます。', [
      { label:'終了して結果を見る', className:'primary', onClick: ()=> endAttack() },
      { label:'続ける', className:'ghost', onClick: ()=>{} },
    ]);
  });
  const editBtn = document.getElementById('editQBtn');
  if(editBtn) editBtn.addEventListener('click', jumpToEditCurrentQuestion);
}

function jumpToEditCurrentQuestion(){
  const q = currentQuestion();
  if(!q) return;
  const editingId = q.id;
  const wasAttack = quizState.mode==='attack';
  if(quizState.timerHandle){ clearInterval(quizState.timerHandle); quizState.timerHandle = null; }

  renderAdminEdit(editingId, null, ()=>{
    const idx = quizState.pool.findIndex(x=>x.id===editingId);
    const fresh = QUESTIONS.find(x=>x.id===editingId);
    if(idx!==-1){
      if(fresh) quizState.pool[idx] = fresh;
      else quizState.pool.splice(idx, 1); // 編集画面で削除された場合はプールからも除去
    }
    view='quiz';
    quizState.answered = false;
    if(wasAttack && quizState.timeLeft > 0) startTimer();
    renderQuiz();
  });
}

function answer(userAns){
  if(quizState.answered) return;
  quizState.answered = true;
  const q = currentQuestion();
  const correct = userAns === q.answer;
  quizState.total++;
  if(correct) quizState.score++;
  else if(quizState.mode==='attack') quizState.wrongList.push(q);

  // 年度順モードの履歴表示（肢ごとの正誤）用に、直近の解答結果を全モード共通で記録する
  PROGRESS.answered[q.id] = correct;
  // 学習ログ（カレンダー表示）用：今日解いた問題数を記録
  const todayKey = dateKey(new Date());
  PROGRESS.dailyLog[todayKey] = (PROGRESS.dailyLog[todayKey] || 0) + 1;
  // タイムアタックの「今の周でまだ出していない問題」優先付け用
  if(quizState.mode==='attack') PROGRESS.lapAnswered[q.id] = true;

  if(quizState.mode==='review'){
    // 復習モード：正解しても自動では卒業しない。「復習完了」ボタンで手動で外す
  } else {
    // 年度順・タイムアタック：間違えた問題だけを復習対象に追加する
    if(!correct){
      PROGRESS.reviewSet[q.id] = true;
    }
  }
  saveProgress(PROGRESS);

  if(quizState.mode==='attack'){
    if(!correct){
      quizState.timeLeft = Math.max(0, quizState.timeLeft - 20);
      const el = document.getElementById('taTimer');
      if(el){
        el.textContent = fmtTime(quizState.timeLeft);
        el.classList.add('penalty');
      }
      // 間違えた時だけ一瞬タイマーを赤くしてから次の問題へ
      setTimeout(()=>{
        if(!quizState || quizState.mode!=='attack') return;
        if(quizState.timeLeft<=0){ endAttack(); return; }
        nextQuestion();
      }, 350);
      return;
    }
    // 正解時は即座に次の問題へ
    if(quizState.timeLeft<=0){ endAttack(); return; }
    nextQuestion();
    return;
  }

  document.querySelectorAll('.ox-btn').forEach(b=>{
    b.disabled = true;
    const btnAns = b.dataset.ans === 'true';
    if(btnAns === q.answer) b.classList.add('correct');
    else if(btnAns === userAns) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedbackZone');
  fb.innerHTML = `
    <div class="feedback ${correct?'ok':'ng'}">
      <strong>${correct ? '○ 正解' : '× 不正解'}</strong>（正答：${q.answer ? '○' : '×'}）
      ${q.explanation ? `<div class="exp">${esc(q.explanation)}</div>` : ''}
    </div>
    <div class="btn-row" style="justify-content:flex-end;">
      ${(quizState.mode==='review' && correct) ? `<button class="btn tape" id="completeBtn">復習完了にする</button>` : ''}
      <button class="btn primary" id="nextBtn">次の問題へ</button>
    </div>
  `;
  document.getElementById('nextBtn').onclick = nextQuestion;
  const completeBtn = document.getElementById('completeBtn');
  if(completeBtn){
    completeBtn.onclick = ()=>{
      delete PROGRESS.reviewSet[q.id];
      saveProgress(PROGRESS);
      toast('復習完了にしました');
      nextQuestion();
    };
  }
}

function nextQuestion(){
  quizState.idx++;
  if(quizState.mode==='year' && quizState.yearKey){ PROGRESS.yearProgress[quizState.yearKey] = quizState.idx; saveProgress(PROGRESS); }
  if(quizState.mode==='attack'){
    if(quizState.timeLeft<=0){ endAttack(); return; }
    if(quizState.idx >= quizState.pool.length){
      // 周回済みなら、周回履歴をリセットしつつ次の周へ。直前の最後の問題と連続しないよう調整
      const lastId = quizState.pool[quizState.pool.length-1] && quizState.pool[quizState.pool.length-1].id;
      let reshuffled = shuffleLapPriority(quizState.pool);
      if(reshuffled.length > 1 && reshuffled[0].id === lastId){
        const swapWith = 1 + Math.floor(Math.random()*(reshuffled.length-1));
        [reshuffled[0], reshuffled[swapWith]] = [reshuffled[swapWith], reshuffled[0]];
      }
      quizState.pool = reshuffled;
      quizState.idx = 0;
    }
  }
  quizState.answered = false;
  renderQuiz();
}

/* ---------------- admin: list ---------------- */
// 「R7-1-ア」「問1-ア」「肢ア」等のカテゴリ表記から、問番号・肢を抽出する
function parseCategoryStructure(category){
  if(!category) return {daimon:null, eda:null};
  let m = category.match(/^[RHS]?\s?\d+\s?-\s?(\d+)\s?-\s?([ア-ン])$/); // R7-1-ア
  if(m) return {daimon:m[1], eda:m[2]};
  m = category.match(/^問\s?(\d+)\s?-\s?([ア-ン])$/); // 問1-ア
  if(m) return {daimon:m[1], eda:m[2]};
  m = category.match(/^肢\s?([ア-ン])$/); // 肢ア（問番号不明）
  if(m) return {daimon:null, eda:m[1]};
  return {daimon:null, eda:null};
}
const EDA_ORDER = ['ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ'];
function edaSortKey(eda){
  const i = EDA_ORDER.indexOf(eda);
  return i===-1 ? 99 : i;
}

        QUESTIONS = QUESTIONS.filter(q=> y===null ? !(q.year==null || isNaN(q.year)) : q.year!==y);

/* ---------------- admin: 第2階層（年度内の問番号一覧） ---------------- */
function renderAdminDaimons(year){
  const qs = QUESTIONS.filter(q=> year===null ? (q.year==null || isNaN(q.year)) : q.year===year);
  const daimonMap = new Map();
  const ungrouped = [];
  qs.forEach(q=>{
    const {daimon} = parseCategoryStructure(q.category);
    if(daimon){
      if(!daimonMap.has(daimon)) daimonMap.set(daimon, []);
      daimonMap.get(daimon).push(q);
    } else {
      ungrouped.push(q);
    }
  });
  const daimonKeys = [...daimonMap.keys()].sort((a,b)=>parseInt(a,10)-parseInt(b,10));

  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← 年度一覧へ</button>

        QUESTIONS = QUESTIONS.filter(q=>!ids.includes(q.id));
        ids.forEach(id=>{ delete PROGRESS.streaks[id]; delete PROGRESS.reviewSet[id]; delete PROGRESS.answered[id]; delete PROGRESS.lapAnswered[id]; });
        await saveQuestions(QUESTIONS); await saveProgress(PROGRESS);
        toast(`${ids.length}問を削除しました`);
        renderAdminDaimons(year);
      }
    });

  });
  if(ungrouped.length){
    const heading = document.createElement('div');
    heading.className = 'm-title serif';
    heading.style.cssText = 'font-size:14px; margin:18px 0 8px;';
    heading.textContent = '区分なし';

      const item = document.createElement('div');

        <div class="ai-meta">${metaLabel(q)}</div>
      `;
      item.addEventListener('click', ()=>renderAdminEdit(q.id, null, ()=>renderAdminDaimons(year), ungroupedIds));
      listEl.appendChild(item);
    });
  }
}

  };
  document.getElementById('downloadExport').onclick = ()=>{

    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ document.getElementById('importText').value = reader.result; };
    reader.readAsText(file);
  });

  function parseImportJson(){
    const raw = document.getElementById('importText').value.trim();
    if(!raw){ toast('データを貼り付けるかファイルを選んでください'); return null; }
    const converted = tryParseQuestionsJson(raw);
    if(!converted){ toast('データの形式が正しくありません'); return null; }
    // id が無いもの（サイトJSON由来など）には新規IDを振る
    return converted.map(q=> q.id ? q : { ...q, id:'q_'+Math.random().toString(36).slice(2)+Date.now().toString(36) });
  }
  document.getElementById('mergeImport').onclick = async ()=>{
    const arr = parseImportJson();
    if(!arr) return;
    const existingIds = new Set(QUESTIONS.map(q=>q.id));
    let added = 0;
    arr.forEach(q=>{
      if(q && q.id && !existingIds.has(q.id)){ QUESTIONS.push(q); existingIds.add(q.id); added++; }
    });
    await saveQuestions(QUESTIONS);
    toast(`${added}問を追加しました`);
    renderAdminList();
  };
  document.getElementById('replaceImport').onclick = async ()=>{
    const arr = parseImportJson();
    if(!arr) return;
    if(!confirm('現在の問題データをすべて削除して、読み込んだデータに置き換えます。よろしいですか？')) return;
    QUESTIONS = arr;
    await saveQuestions(QUESTIONS);
    toast(`${arr.length}問に置き換えました`);
    renderAdminList();
  };
}

/* ---------------- bulk import: parsing ----------------
   参考サイト（totikao-quiz）のページをスマホで「すべて選択→コピー」してそのまま
   貼り付けられるよう、ナビゲーションやフッターなどの定型文を自動で除去してから解析します。

   このサイトは1問（例：問1）が「肢 ア／イ／ウ／エ／オ」の5つの○×枝に分かれており、
   各枝ごとに「解答：○」のように解答が書かれています。まずこの書式を優先的に認識し、
   見つからない場合は「問1」「問2」等の番号や空行区切りで解析するフォールバックに回ります。
   自動認識できなかった問題は「要確認」として残るので、取り込み前に必ず確認してください。
------------------------------------------------------- */

// サイトのナビゲーション・フッターなどによくある定型文（このアプリ自身の文言も含む）を除去
const NOISE_LINE_PATTERNS = [
  /^(TOP|ホーム|トップ|トップへ|メニュー|戻る|次へ|一覧へ戻る|年度一覧へ)$/i,
  /^(年度順|復習|タイムアタック|年度別過去問を見る|続きから)モード?$/,
  /^次の問題（問\s?\d+）→$/, /^←?前の問題（問\s?\d+）$/,
  /の問題一覧へ$/,
  /^この問題からクイズを始める$/,
  /^出典[:：]/,
  /^JSONデータに解説・根拠の記載がないため/,
  /^(令和|平成)\d+年度土地家屋調査士試験の問\s?\d+です/,
  /^土地家屋調査士\s*(令和|平成)\d+年度\s*過去問・解答\s*問\s?\d+$/,
  /^(令和|平成)\d+年度・問\s?\d+$/,
  /^(令和|平成)\d+年度$/,
  /^問\s?\d+$/,
  /アクセス解析とプライバシー/, /プライバシーについて/,
  /法務省.{0,10}(帰属|著作権)/, /個人の学習支援を目的とした非公式/,
  /^以上$/,
  /^@\w+$/, /^[Xx]\s*\(旧Twitter\)$/, /^シェア$/, /^Tweet$/, /^Follow$/i,
  /^(進捗を読み込み中|読み込み中)[…\.]*$/,
  /^\d+\s*\/\s*\d+$/, // "3 / 45" のような進捗表示
  /^(正答|スコア|score)\s*[:：]?\s*\d+/i,
];
function isNoiseLine(line){
  return NOISE_LINE_PATTERNS.some(re=>re.test(line));
}

// 「令和7年度」→2025、「平成30年度」→2018 のように和暦を西暦へ変換
function detectYear(raw){
  let m = raw.match(/令和\s?(\d+)\s?年度?/);
  if(m) return 2018 + parseInt(m[1], 10);
  m = raw.match(/平成\s?(\d+)\s?年度?/);
  if(m) return 1988 + parseInt(m[1], 10);
  m = raw.match(/昭和\s?(\d+)\s?年度?/);
  if(m) return 1925 + parseInt(m[1], 10);
  m = raw.match(/(20\d\d)\s?年度?/);
  if(m) return parseInt(m[1], 10);
  // フォールバック：「R7-1-ア」のようなID内の略記（R=令和／H=平成／S=昭和）から推定
  m = raw.match(/\bR\s?(\d+)\s*-\s*\d+\s*-\s*[ア-ン]/);
  if(m) return 2018 + parseInt(m[1], 10);
  m = raw.match(/\bH\s?(\d+)\s*-\s*\d+\s*-\s*[ア-ン]/);
  if(m) return 1988 + parseInt(m[1], 10);
  m = raw.match(/\bS\s?(\d+)\s*-\s*\d+\s*-\s*[ア-ン]/);
  if(m) return 1925 + parseInt(m[1], 10);
  return new Date().getFullYear();
}
function detectDaimon(raw){
  const m = raw.match(/(?:^|\n)問\s?(\d+)\s*(?:\n|$)/);
  return m ? m[1] : '';
}

function preClean(raw){
  const lines = raw.split('\n').map(l=>l.trim());
  const cleaned = [];
  const seenNav = new Map(); // 短い行（ナビっぽい）が何度も出てきたら以降は除去
  const protectFromDedup = l => ansWordPattern.test(l) || lineIsAnswerOnly.test(l) || /^肢\s?[ア-ン]\s*$/.test(l) || idLinePattern.test(l);
  lines.forEach(line=>{
    if(!line) { cleaned.push(''); return; }
    if(isNoiseLine(line)) return;
    if(line.length <= 6 && !protectFromDedup(line)){
      const c = (seenNav.get(line)||0) + 1;
      seenNav.set(line, c);
      if(c >= 3) return; // 3回以上出てくる短い行はナビの可能性が高いので除去
    }
    cleaned.push(line);
  });
  return cleaned.join('\n').replace(/\n{3,}/g, '\n\n');
}

const ansWordPattern = /(正解|解答|答え)\s*[:：]?\s*(○|×|〇|X|x|✕|正しい|誤り|true|false)/i;
const lineIsAnswerOnly = /^(○|×|〇|X|x|✕)$/;
const idLinePattern = /^[RHS]?\s?\d+\s?-\s?\d+\s?-\s?[ア-ンA-Za-z]\s*$/; // 例: R7-1-ア

function normalizeAns(token){
  const t = token.trim().toLowerCase();
  if(['×','x','✕','誤り','false'].includes(t)) return false;
  return true; // ○/〇/正しい/true/デフォルト
}

/* ---------------- パターンC：構造化JSON形式 ----------------
   { "year":"令和7年度", "questions":[ { "no":1, "items":[ {"id":"R7-1-ア","text":"...","answer":true}, ... ] } ] }
   のような、年度単位でまとめられたJSONをそのまま取り込めるようにする。
   （このアプリ自身の書き出し形式である配列 [ {id,year,category,text,answer,...}, ... ] にも対応）
------------------------------------------------------- */
// year欄が「令和7年度」だけでなく「R7」のような略記のみの場合にも対応
function parseYearLabel(label){
  const s = String(label||'').trim();
  let m = s.match(/令和\s?(\d+)/); if(m) return 2018 + parseInt(m[1],10);
  m = s.match(/平成\s?(\d+)/); if(m) return 1988 + parseInt(m[1],10);
  m = s.match(/昭和\s?(\d+)/); if(m) return 1925 + parseInt(m[1],10);
  m = s.match(/^[Rr]\s?(\d+)/); if(m) return 2018 + parseInt(m[1],10);
  m = s.match(/^[Hh]\s?(\d+)/); if(m) return 1988 + parseInt(m[1],10);
  m = s.match(/^[Ss]\s?(\d+)/); if(m) return 1925 + parseInt(m[1],10);
  m = s.match(/(20\d\d)/); if(m) return parseInt(m[1],10);
  return new Date().getFullYear();
}
function convertSiteYearJson(obj){
  if(!obj || typeof obj !== 'object' || Array.isArray(obj) || !Array.isArray(obj.questions)) return null;
  const year = parseYearLabel(obj.year);
  const results = [];
  obj.questions.forEach(q=>{
    if(!q || !Array.isArray(q.items)) return;
    q.items.forEach(it=>{
      if(!it || !it.text) return;
      results.push({
        year,
        category: it.id || (q.no ? `問${q.no}-${it.label||''}` : (it.label||'')),
        text: String(it.text).trim(),
        answer: !!it.answer,
        explanation: it.explanation || ''
      });
    });
  });
  return results.length ? results : null;
}
function tryParseQuestionsJson(raw){
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return null; }
  if(Array.isArray(parsed)){
    if(parsed.length===0) return [];
    if(parsed[0] && Array.isArray(parsed[0].questions)){
      // 複数年度分の配列
      let all = [];
      parsed.forEach(o=>{ const c = convertSiteYearJson(o); if(c) all = all.concat(c); });
      return all.length ? all : null;
    }
    // このアプリ自身の書き出し形式（配列）とみなす
    return parsed.map(q=>({
      id: q.id,
      year: q.year || new Date().getFullYear(),
      category: q.category || '',
      text: q.text || '',
      answer: !!q.answer,
      explanation: q.explanation || ''
    }));
  }
  return convertSiteYearJson(parsed);
}

function parseBulkText(rawInput){
  const trimmed = rawInput.trim();
  if(trimmed.startsWith('{') || trimmed.startsWith('[')){
    const jsonQuestions = tryParseQuestionsJson(trimmed);
    if(jsonQuestions){
      return jsonQuestions.map((q,i)=>({
        key: 'imp_'+i+'_'+Date.now().toString(36),
        year: q.year, category: q.category||'', text: q.text,
        answer: !!q.answer, explanation: q.explanation||'',
        needsCheck: false
      }));
    }
  }

  const year = detectYear(rawInput);
  const daimon = detectDaimon(rawInput);
  const raw = preClean(rawInput);

  // ---- パターンA：「肢 ア／イ／ウ／エ／オ」形式（totikao-quizの過去問ページ） ----
  const edaMarker = /^肢\s?([ア-ン])\s*$/;
  const rawLines = raw.split('\n').map(l=>l.trim());
  const edaIdxs = [];
  rawLines.forEach((l,i)=>{ if(edaMarker.test(l)) edaIdxs.push(i); });

  if(edaIdxs.length > 0){
    const results = [];
    edaIdxs.forEach((startIdx, n)=>{
      const endIdx = n+1 < edaIdxs.length ? edaIdxs[n+1] : rawLines.length;
      const eda = rawLines[startIdx].match(edaMarker)[1];
      const chunk = rawLines.slice(startIdx+1, endIdx).filter(Boolean);

      let idLabel = '';
      let answer = null;
      const bodyLines = [];
      chunk.forEach(line=>{
        if(!idLabel && idLinePattern.test(line)){ idLabel = line.replace(/\s*-\s*/g,'-').trim(); return; }
        if(answer===null){
          const m = line.match(ansWordPattern);
          if(m){ answer = normalizeAns(m[2]); return; }
          if(lineIsAnswerOnly.test(line)){ answer = normalizeAns(line); return; }
        }
        bodyLines.push(line);
      });
      const text = bodyLines.join('\n').trim();
      if(!text) return;
      results.push({
        key: 'imp_'+startIdx+'_'+Date.now().toString(36),
        year, category: idLabel || (daimon ? `問${daimon}-${eda}` : `肢${eda}`),
        text, answer: answer===null ? true : answer, explanation:'',
        needsCheck: answer===null
      });
    });
    if(results.length) return results;
  }

  // ---- パターンB：フォールバック（問n番号 or 空行区切り + 解答行） ----
  let blocks = raw.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  const qNumSplit = /\n(?=(問\s?\d+|第\s?\d+\s?問)\s)/;
  blocks = blocks.flatMap(b=>{
    const parts = b.split(qNumSplit).map(s=>s.trim()).filter(Boolean);
    return parts.length > 1 ? parts : [b];
  });

  const results = [];
  blocks.forEach((block, i)=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    let answer = null;
    let bodyLines = [];

    lines.forEach(line=>{
      if(answer===null){
        const m = line.match(ansWordPattern);
        if(m){
          answer = normalizeAns(m[2]);
          const stripped = line.replace(ansWordPattern, '').trim();
          if(stripped) bodyLines.push(stripped);
          return;
        }
        if(lineIsAnswerOnly.test(line)){
          answer = normalizeAns(line);
          return;
        }
      }
      bodyLines.push(line.replace(/^(問\s?\d+[\.．、:：]?|\(?\d+\)?[\.．、:：])\s*/, ''));
    });

    const text = bodyLines.join('\n').trim();
    if(!text) return;

    results.push({
      key: 'imp_'+i+'_'+Date.now().toString(36),
      year, category:'', text,
      answer: answer===null ? true : answer, explanation:'',
      needsCheck: answer===null
    });
  });
  return results;
}

let PARSED_BUFFER = [];

function renderBulkImport(){
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← 問題一覧へ</button>
    </div>
    <div class="card tape-left">
      <div class="m-title serif" style="font-size:16px; margin-bottom:6px;">まとめて貼り付けて取り込む</div>
      <div class="hint">
        スマホの場合：参考サイトの過去問ページを開き、文章を長押し→「すべて選択」→コピーして、下に貼り付けてください。ナビやフッターの余計な文字は自動である程度取り除きます。<br><br>
        ・「問1」「問2」のような番号や、空行の位置で自動的に1問ずつ分割します<br>
        ・「正解：○」「解答:×」のように解答が書かれていれば自動で読み取ります<br>
        ・自動で読み取れなかった問題は「要確認」と表示されるので、次の画面で○×を選び直してください
      </div>
    </div>
    <div class="import-box">
      <textarea id="bulkText" placeholder="ページ全体をそのまま貼り付けてOKです。例）
問1　表示に関する登記は、登記官が職権で行うことができる場合がある。
正解：○

問2　土地の分筆登記の申請には、地積測量図を提供する必要はない。
解答：×
"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn tape" id="parseBtn">解析してプレビュー</button>
      <button class="btn ghost" id="cancelBulk">キャンセル</button>
    </div>
    <div id="previewZone"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>renderAdminList();
  document.getElementById('cancelBulk').onclick = ()=>renderAdminList();
  document.getElementById('parseBtn').onclick = ()=>{
    const raw = document.getElementById('bulkText').value;
    if(!raw.trim()){ toast('テキストを貼り付けてください'); return; }
    PARSED_BUFFER = parseBulkText(raw);
    if(PARSED_BUFFER.length===0){ toast('問題を認識できませんでした。改行の入れ方を確認してください。'); return; }
    renderBulkPreview();
  };
}

function renderBulkPreview(){
  const zone = document.getElementById('previewZone');
  const checkCount = PARSED_BUFFER.filter(p=>p.needsCheck).length;
  zone.innerHTML = `
    <div class="card gold-left" style="margin-top:20px;">
      <div class="m-title serif" style="font-size:15px;">${PARSED_BUFFER.length}問を検出しました${checkCount? `（うち要確認 ${checkCount}問）`:''}</div>
      <div class="hint">内容と○×・年度を確認し、必要なら修正してから「この内容で取り込む」を押してください。不要な問題は「除外」で取り込みから外せます。</div>
    </div>
    <div id="parsedList"></div>
    <div class="btn-row">
      <button class="btn primary" id="commitBtn">この内容で取り込む</button>
      <button class="btn ghost" id="backParse">貼り付けに戻る</button>
    </div>
  `;
  document.getElementById('backParse').onclick = ()=>renderBulkImport();

  const listEl = document.getElementById('parsedList');
  PARSED_BUFFER.forEach((p, idx)=>{
    const div = document.createElement('div');
    div.className = 'parsed-item';
    div.dataset.key = p.key;
    div.innerHTML = `
      ${p.needsCheck ? `<div class="p-flag">⚠ ○×を自動判定できませんでした。確認してください</div>` : ''}
      <div class="p-head">
        <input type="text" value="${esc(p.category||'')}" data-f="category" placeholder="区分（例：R7-1-ア）" style="flex:1; min-width:0;">
        <input type="number" value="${p.year==null?'':p.year}" data-f="year" title="${yearLabel(p.year)}" placeholder="空欄=オリジナル" style="width:80px;">
        <select data-f="answer">
          <option value="true" ${p.answer?'selected':''}>○（正しい）</option>
          <option value="false" ${!p.answer?'selected':''}>×（誤り）</option>
        </select>
        <button class="p-remove" data-remove>除外</button>
      </div>
      <textarea data-f="text">${esc(p.text)}</textarea>
    `;
    listEl.appendChild(div);

    div.querySelector('[data-remove]').addEventListener('click', ()=>{
      PARSED_BUFFER = PARSED_BUFFER.filter(x=>x.key!==p.key);
      renderBulkPreview();
    });
  });

  document.getElementById('commitBtn').onclick = async ()=>{
    document.querySelectorAll('.parsed-item').forEach(div=>{
      const key = div.dataset.key;
      const item = PARSED_BUFFER.find(x=>x.key===key);
      if(!item) return;
      item.category = div.querySelector('[data-f="category"]').value.trim();
      { const yRaw = div.querySelector('[data-f="year"]').value.trim(); item.year = yRaw==='' ? null : (parseInt(yRaw,10) || item.year); }
      item.answer = div.querySelector('[data-f="answer"]').value === 'true';
      item.text = div.querySelector('[data-f="text"]').value.trim();
    });
    const valid = PARSED_BUFFER.filter(p=>p.text);
    if(valid.length===0){ toast('取り込める問題がありません'); return; }
    valid.forEach(p=>{
      QUESTIONS.push({ id:'q_'+Math.random().toString(36).slice(2)+Date.now().toString(36), year:p.year, category:p.category||'', text:p.text, answer:p.answer, explanation:'' });
    });
    await saveQuestions(QUESTIONS);
    toast(`${valid.length}問を取り込みました`);
    PARSED_BUFFER = [];
    renderAdminList();
  };
}

/* ---------------- スマホの「戻る」ボタン対策 ----------------
   このアプリは1ページ内で画面遷移しているため、そのままだとスマホの「戻る」で
   アプリごと閉じてしまう。履歴を1つ積んでおき、「戻る」が押されたら検知して
   ホーム画面に戻すようにする（アプリ自体を閉じる操作はスワイプ等で行う想定）。
------------------------------------------------------- */
function setupBackButtonHandling(){
  history.pushState({app:true}, '', location.href);
  window.addEventListener('popstate', ()=>{
    history.pushState({app:true}, '', location.href); // 次の「戻る」も捕まえられるよう積み直す
    if(quizState && quizState.timerHandle){ clearInterval(quizState.timerHandle); quizState.timerHandle = null; }
    if(view !== 'home'){
      view = 'home';
      renderHome();
    }
  });
}

/* ---------------- boot ---------------- */
(async function init(){
  app.innerHTML = `<div class="empty">読み込み中…</div>`;
  QUESTIONS = await loadQuestions();
  PROGRESS = await loadProgress();
  setupBackButtonHandling();
  renderHome();
})();
</script>
