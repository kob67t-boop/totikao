<style>
  :root{
    --paper:#F5F1E6;
    --paper-line:#DAD3BF;
    --ink:#1E2A38;
    --ink-soft:#3C4A5C;
    --stake:#B5472B;
    --stake-dark:#8F3620;
    --tape:#2E6E5E;
    --tape-dark:#1F4F43;
    --card:#FBF9F2;
    --gold:#B7902F;
    --danger:#A9312B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      var(--paper);
    background-blend-mode:multiply;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .serif{font-family:'Shippori Mincho', serif;}

  .ruler{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:#EDE6D4;
    padding:10px 0 0 0;
    box-shadow:0 2px 0 var(--stake);
  }
  .ruler-track{
    display:flex; align-items:flex-end; height:22px;
    overflow:hidden; padding:0 10px;
  }
  .tick{flex:0 0 auto; width:27px; text-align:left; position:relative; height:100%;}
  .tick::before{
    content:''; position:absolute; left:0; bottom:0; width:1px; background:#8C8368; height:8px;
  }
  .tick.major::before{height:14px; background:#EDE6D4;}
  .tick.major .num{
    position:absolute; left:2px; bottom:14px; font-size:9px; color:#B7AE93; letter-spacing:0.5px;
  }
  .ruler-title{
    max-width:640px; margin:0 auto; padding:10px 20px 14px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .ruler-title h1{
    font-size:19px; margin:0; font-weight:700; letter-spacing:1px; color:#F4EFDF;
  }
  .ruler-title .tag{
    font-size:11px; color:var(--stake); border:1px solid var(--stake); padding:2px 8px; border-radius:2px; letter-spacing:1px;
  }

  .wrap{max-width:640px; margin:0 auto; padding:24px 20px 80px;}

  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:50%;
    border:2px solid var(--stake); color:var(--stake);
    font-family:'Shippori Mincho', serif; font-weight:800; font-size:13px;
    transform:rotate(-8deg);
    flex:0 0 auto;
  }

  .home-hero{display:flex; align-items:center; gap:16px; margin-bottom:28px;}
  .home-hero .lede{font-size:13px; color:var(--ink-soft); line-height:1.7; margin-top:4px;}

  .card{
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--ink);
    padding:18px 18px; margin-bottom:14px; position:relative;
  }
  .card.stake-left{border-left-color:var(--stake);}
  .card.tape-left{border-left-color:var(--tape);}
  .card.gold-left{border-left-color:var(--gold);}

  .mode-btn{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--ink);
    padding:16px 18px; margin-bottom:12px; font-family:inherit; color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .mode-btn:hover{transform:translateX(2px); box-shadow:3px 3px 0 rgba(30,42,56,0.08);}
  .mode-btn .m-title{font-family:'Shippori Mincho',serif; font-size:17px; font-weight:700;}
  .mode-btn .m-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .mode-btn .m-arrow{font-size:20px; color:var(--stake);}
  .mode-btn.year{border-left-color:var(--ink);}
  .mode-btn.review{border-left-color:var(--tape);}
  .mode-btn.attack{border-left-color:var(--stake);}
  .mode-btn.admin{border-left-color:var(--gold);}

  .foot-note{
    font-size:11px; color:var(--ink-soft); line-height:1.8; margin-top:32px;
    border-top:1px dashed var(--paper-line); padding-top:16px;
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
  .back{
    background:none; border:none; color:var(--ink-soft); font-family:inherit; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:6px; padding:6px 0;
  }
  .progress-pill{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink);
    background:#EDE7D6; border:1px solid var(--paper-line); padding:4px 10px; border-radius:20px;
  }
  .timer{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; color:var(--ink);}
  .timer.low{color:var(--danger);}

  .q-card{
    background:var(--card); border:1px solid var(--paper-line);
    padding:22px 20px 24px; position:relative; margin-bottom:16px;
  }
  .q-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 14px);
  }
  .q-meta{font-size:11px; color:var(--stake); letter-spacing:1px; margin-bottom:10px; font-family:'JetBrains Mono',monospace;}
  .q-text{font-size:16.5px; line-height:1.9; white-space:pre-wrap;}

  /* ○× choice buttons */
  .ox-row{display:flex; gap:14px; margin-bottom:6px;}
  .ox-btn{
    flex:1; cursor:pointer; font-family:'Shippori Mincho',serif; font-weight:800;
    background:var(--card); border:2px solid var(--ink); color:var(--ink);
    padding:26px 0; font-size:44px; line-height:1; text-align:center;
    transition:transform .1s ease, background .1s ease, border-color .1s ease;
  }
  .ox-btn:hover{transform:translateY(-2px); box-shadow:3px 3px 0 rgba(30,42,56,0.12);}
  .ox-btn.maru{color:var(--tape); border-color:var(--tape);}
  .ox-btn.batsu{color:var(--stake); border-color:var(--stake);}
  .ox-btn:disabled{cursor:default;}
  .ox-btn:disabled:hover{transform:none; box-shadow:none;}
  .ox-btn.correct{background:#EAF3EF; border-color:var(--tape); color:var(--tape-dark); box-shadow:0 0 0 3px rgba(46,110,94,0.15) inset;}
  .ox-btn.wrong{background:#F6EAE9; border-color:var(--danger); color:var(--danger); box-shadow:0 0 0 3px rgba(169,49,43,0.15) inset;}
  .ox-btn .sub{display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:11px; font-weight:500; letter-spacing:2px; margin-top:4px;}

  .feedback{margin-top:14px; padding:14px 16px; border:1px dashed var(--paper-line); font-size:13.5px; line-height:1.8;}
  .feedback.ok{border-color:var(--tape); color:var(--tape-dark);}
  .feedback.ng{border-color:var(--danger); color:var(--danger);}
  .feedback .exp{color:var(--ink-soft); margin-top:8px; font-size:13px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--ink); color:#F4EFDF; border:none; padding:12px 22px;
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:14.5px; letter-spacing:1px;
    cursor:pointer; transition:transform .1s ease, background .1s ease;
  }
  .btn:hover{transform:translateY(-1px); background:var(--ink-soft);}
  .btn.primary{background:var(--stake);}
  .btn.primary:hover{background:var(--stake-dark);}
  .btn.tape{background:var(--tape);}
  .btn.tape:hover{background:var(--tape-dark);}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn.small{padding:8px 14px; font-size:12.5px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  .btn-row{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}

  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty .big{font-family:'Shippori Mincho',serif; font-size:20px; color:var(--ink); margin-bottom:8px;}

  .admin-list-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--gold);
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .admin-list-item:hover{border-color:var(--gold);}
  .admin-list-item .ai-text{font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .admin-list-item .ai-ans{
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:15px; flex:0 0 auto; width:24px; text-align:center;
  }
  .admin-list-item .ai-ans.maru{color:var(--tape);}
  .admin-list-item .ai-ans.batsu{color:var(--stake);}
  .admin-list-item .ai-meta{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; flex:0 0 auto;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:0.5px;}
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%; font-family:inherit; font-size:14px; padding:10px 11px;
    border:1px solid var(--paper-line); background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px; line-height:1.6;}

  .ox-toggle{display:flex; gap:10px;}
  .ox-toggle label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    border:1.5px solid var(--paper-line); padding:10px; cursor:pointer; font-family:'Shippori Mincho',serif; font-weight:700; font-size:16px;
  }
  .ox-toggle input{accent-color:var(--tape); width:16px; height:16px;}
  .ox-toggle label.active-maru{border-color:var(--tape); color:var(--tape); background:#EAF3EF;}
  .ox-toggle label.active-batsu{border-color:var(--stake); color:var(--stake); background:#F6EAE9;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#F4EFDF; padding:10px 18px; font-size:13px;
    border-left:4px solid var(--tape); z-index:50; box-shadow:0 4px 14px rgba(0,0,0,0.2); max-width:88vw; text-align:center;
  }
  .danger-link{color:var(--danger); background:none; border:none; font-family:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0;}

  /* bulk import */
  .import-box textarea{width:100%; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.7; min-height:220px; padding:12px; border:1px solid var(--paper-line);}
  .parsed-item{
    background:var(--card); border:1px solid var(--paper-line); border-left:4px solid var(--gold);
    padding:12px 14px; margin-bottom:10px;
  }
  .parsed-item .p-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;}
  .parsed-item .p-text{font-size:13.5px; line-height:1.7; white-space:pre-wrap;}
  .parsed-item textarea{width:100%; font-family:inherit; font-size:13.5px; padding:8px; border:1px solid var(--paper-line); min-height:52px;}
  .parsed-item select, .parsed-item input[type=number]{font-family:inherit; font-size:13px; padding:5px 7px; border:1px solid var(--paper-line);}
  .parsed-item .p-remove{font-size:11px; color:var(--danger); background:none; border:none; cursor:pointer; text-decoration:underline;}
  .parsed-item .p-flag{font-size:10.5px; color:var(--stake); letter-spacing:0.5px; margin-bottom:4px;}
  .hint{font-size:11.5px; color:var(--ink-soft); line-height:1.8;}

  @media (max-width:420px){
    .ruler-title h1{font-size:16px;}
    .ox-btn{font-size:34px; padding:20px 0;}
  }
</style>
</head>
<body>

<div class="ruler">
  <div class="ruler-track" id="rulerTrack"></div>
  <div class="ruler-title">
    <h1>土地家屋調査士 過去問クイズ帳</h1>
    <span class="tag">FIELD NOTE ed.</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ---------------- ruler decoration ---------------- */
(function(){
  const track = document.getElementById('rulerTrack');
  let html = '';
  for(let i=0;i<40;i++){
    const major = i % 5 === 0;
    html += `<div class="tick ${major?'major':''}">${major?`<span class="num">${i}</span>`:''}</div>`;
  }
  track.innerHTML = html;
})();

/* ---------------- sample data (○×形式) ----------------
   サンプルはダミーです。実際の過去問は「問題を管理する」→「まとめて貼り付けて取り込む」
   から、参考サイトのテキストをコピーして自動取り込みしてください。
------------------------------------------------- */
const SAMPLE_QUESTIONS = [
  { id:'s1', year:2023, category:'午前の部(サンプル)', text:'表示に関する登記は、登記官が職権で行うことができる場合がある。（サンプル問題）', answer:true,
    explanation:'サンプル解説です。実際の解説文に差し替えてください。' },
  { id:'s2', year:2023, category:'午前の部(サンプル)', text:'土地の分筆登記の申請には、地積測量図を提供する必要はない。（サンプル問題）', answer:false,
    explanation:'サンプル解説です。実際の条文・先例に基づく解説に差し替えてください。' },
  { id:'s3', year:2022, category:'午後の部(サンプル)', text:'建物の表題登記は、所有権を取得した日から1か月以内に申請しなければならない。（サンプル問題）', answer:true,
    explanation:'サンプル解説文です。編集画面から本文に差し替えてください。' },
  { id:'s4', year:2021, category:'午後の部(サンプル)', text:'筆界特定は、筆界特定登記官ではなく裁判所が行う。（サンプル問題）', answer:false,
    explanation:'サンプル解説文です。編集画面から本文に差し替えてください。' }
];

/* ---------------- storage helpers ---------------- */
async function loadQuestions(){
  try{
    const res = await window.storage.get('questions');
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return SAMPLE_QUESTIONS.slice();
}
async function saveQuestions(qs){ await window.storage.set('questions', JSON.stringify(qs)); }
async function loadProgress(){
  try{
    const res = await window.storage.get('progress');
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return { streaks:{}, yearIndex:0, taScores:[] };
}
async function saveProgress(p){ await window.storage.set('progress', JSON.stringify(p)); }

/* ---------------- app state ---------------- */
let QUESTIONS = [];
let PROGRESS = { streaks:{}, yearIndex:0, taScores:[] };
let view = 'home';
let quizState = null;

const app = document.getElementById('app');

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- render: home ---------------- */
function renderHome(){
  const reviewCount = QUESTIONS.filter(q => (PROGRESS.streaks[q.id]||0) < 3).length;
  app.innerHTML = `
    <div class="home-hero">
      <div class="stamp serif">全${QUESTIONS.length}問</div>
      <div class="lede">○×形式で出題します。年度順・復習・タイムアタックの3モード。<br>「問題を管理する」から、問題文や正解を編集・追加・一括取り込みできます。</div>
    </div>

    <button class="mode-btn year" data-go="year">
      <div><div class="m-title serif">年度順モード</div><div class="m-sub">古い年度から順番に、全問を通しで出題</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn review" data-go="review">
      <div><div class="m-title serif">復習モード</div><div class="m-sub">未習得の問題（${reviewCount}問）を年度順に出題。3回連続正解で復習完了</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn attack" data-go="attack">
      <div><div class="m-title serif">タイムアタック（5分）</div><div class="m-sub">制限時間内に何問正解できるか。誤答で残り時間-20秒</div></div>
      <div class="m-arrow">→</div>
    </button>

    <button class="mode-btn admin" data-go="admin">
      <div><div class="m-title serif">問題を管理する</div><div class="m-sub">編集・追加・削除／まとめて貼り付けて取り込む</div></div>
      <div class="m-arrow">→</div>
    </button>

    <div class="foot-note">
      本アプリのサンプル問題はダミーです。実際の過去問は法務省「土地家屋調査士試験」の公表問題を、ご自身でコピーして取り込んでご利用ください。問題文の著作権は法務省に帰属します。
    </div>
  `;
  app.querySelectorAll('[data-go]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mode = btn.dataset.go;
      if(mode==='admin'){ view='admin'; renderAdminList(); }
      else startQuiz(mode);
    });
  });
}

/* ---------------- quiz engine ---------------- */
function startQuiz(mode){
  if(QUESTIONS.length===0){
    view='home'; renderHome();
    toast('問題が登録されていません。まず「問題を管理する」から追加してください。');
    return;
  }
  let pool;
  if(mode==='year'){
    pool = QUESTIONS.slice().sort((a,b)=>a.year-b.year);
  } else if(mode==='review'){
    pool = QUESTIONS.filter(q=>(PROGRESS.streaks[q.id]||0) < 3).sort((a,b)=>a.year-b.year);
    if(pool.length===0){
      view='home'; renderHome();
      toast('復習対象の問題はありません。すべて習得済みです。');
      return;
    }
  } else if(mode==='attack'){
    pool = QUESTIONS.slice().sort(()=>Math.random()-0.5);
  }

  quizState = {
    mode, pool, idx: (mode==='year' ? Math.min(PROGRESS.yearIndex, pool.length-1) : 0),
    answered:false, score:0, total:0, wrongList:[],
    timeLeft: mode==='attack' ? 300 : null, timerHandle: null, ended:false
  };
  view='quiz';
  renderQuiz();
  if(mode==='attack') startTimer();
}

function startTimer(){
  if(quizState.timerHandle) clearInterval(quizState.timerHandle);
  quizState.timerHandle = setInterval(()=>{
    quizState.timeLeft--;
    const el = document.getElementById('taTimer');
    if(el){ el.textContent = fmtTime(quizState.timeLeft); el.classList.toggle('low', quizState.timeLeft <= 30); }
    if(quizState.timeLeft<=0){ clearInterval(quizState.timerHandle); endAttack(); }
  }, 1000);
}
function fmtTime(s){ s=Math.max(0,s); const m=Math.floor(s/60), sec=s%60; return `${m}:${String(sec).padStart(2,'0')}`; }
function endAttack(){
  if(!quizState || quizState.ended) return;
  quizState.ended = true;
  if(quizState.timerHandle) clearInterval(quizState.timerHandle);
  const total = quizState.total, score = quizState.score;
  const wrongList = quizState.wrongList;
  PROGRESS.taScores.unshift({date:new Date().toISOString(), score, total});
  PROGRESS.taScores = PROGRESS.taScores.slice(0,10);
  saveProgress(PROGRESS);

  const wrongHtml = wrongList.length === 0
    ? `<div class="card tape-left" style="margin-top:18px;"><div style="font-size:13.5px; color:var(--tape-dark);">間違えた問題はありませんでした。</div></div>`
    : `
      <div class="m-title serif" style="font-size:15px; margin:22px 0 10px;">間違えた問題（${wrongList.length}問）</div>
      ${wrongList.map(q=>`
        <div class="card stake-left">
          <div class="q-meta" style="margin-bottom:6px;">${q.year}年度 ／ ${esc(q.category||'')}</div>
          <div style="font-size:14px; line-height:1.8; white-space:pre-wrap;">${esc(q.text)}</div>
          <div style="margin-top:8px; font-size:13px;">正答：<strong class="${q.answer?'':''}" style="color:${q.answer?'var(--tape-dark)':'var(--stake)'};">${q.answer?'○':'×'}</strong></div>
          ${q.explanation ? `<div style="margin-top:6px; font-size:12.5px; color:var(--ink-soft);">${esc(q.explanation)}</div>` : ''}
        </div>
      `).join('')}
    `;

  app.innerHTML = `
    <div class="empty">
      <div class="big serif">タイムアタック終了</div>
      <div class="mono" style="font-size:32px; margin:14px 0; color:var(--stake);">${total}問</div>
      <div style="font-size:13px; color:var(--ink-soft);">時間内に解答しました（正解 ${score} ／ 誤答 ${wrongList.length}）</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn primary" id="retryTa">もう一度</button>
        <button class="btn ghost" id="toHome">ホームへ</button>
      </div>
    </div>
    ${wrongHtml}
  `;
  document.getElementById('retryTa').onclick = ()=>startQuiz('attack');
  document.getElementById('toHome').onclick = ()=>{ view='home'; renderHome(); };
}

function currentQuestion(){ return quizState.pool[quizState.idx]; }

function renderQuiz(){
  const q = currentQuestion();
  if(!q){
    if(quizState.mode==='year'){ PROGRESS.yearIndex = 0; saveProgress(PROGRESS); }
    app.innerHTML = `
      <div class="empty">
        <div class="big serif">お疲れさまでした</div>
        <div style="font-size:13px;">${quizState.mode==='review' ? '復習対象の問題をすべて終えました。' : '出題範囲をすべて終えました。'}</div>
        <div class="mono" style="font-size:20px; margin:14px 0;">正答 ${quizState.score} / ${quizState.total}</div>
        <div class="btn-row" style="justify-content:center;"><button class="btn ghost" id="toHome">ホームへ</button></div>
      </div>`;
    document.getElementById('toHome').onclick = ()=>{ view='home'; renderHome(); };
    return;
  }

  const modeLabel = {year:'年度順モード', review:'復習モード', attack:'タイムアタック'}[quizState.mode];

  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← ホームへ</button>
      ${quizState.mode==='attack'
        ? `<div class="timer mono" id="taTimer">${fmtTime(quizState.timeLeft)}</div>`
        : `<div class="progress-pill">${quizState.idx+1} / ${quizState.pool.length}</div>`}
    </div>
    <div class="q-card">
      <div class="q-meta">${modeLabel} ／ ${q.year}年度 ／ ${esc(q.category||'')}</div>
      <div class="q-text serif">${esc(q.text)}</div>
    </div>
    <div class="ox-row" id="oxRow">
      <button class="ox-btn maru" data-ans="true">○<span class="sub">正しい</span></button>
      <button class="ox-btn batsu" data-ans="false">×<span class="sub">誤り</span></button>
    </div>
    <div id="feedbackZone"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{
    if(quizState.timerHandle) clearInterval(quizState.timerHandle);
    view='home'; renderHome();
  };
  document.querySelectorAll('.ox-btn').forEach(b=>{
    b.addEventListener('click', ()=>answer(b.dataset.ans === 'true'));
  });
}

function answer(userAns){
  if(quizState.answered) return;
  quizState.answered = true;
  const q = currentQuestion();
  const correct = userAns === q.answer;
  quizState.total++;
  if(correct) quizState.score++;
  else if(quizState.mode==='attack') quizState.wrongList.push(q);

  const cur = PROGRESS.streaks[q.id] || 0;
  PROGRESS.streaks[q.id] = correct ? cur+1 : 0;
  saveProgress(PROGRESS);

  if(quizState.mode==='attack'){
    if(!correct) quizState.timeLeft = Math.max(0, quizState.timeLeft - 20);
    // タイムアタックは正誤表示なしで即座に次の問題へ
    if(quizState.timeLeft<=0){ endAttack(); return; }
    nextQuestion();
    return;
  }

  document.querySelectorAll('.ox-btn').forEach(b=>{
    b.disabled = true;
    const btnAns = b.dataset.ans === 'true';
    if(btnAns === q.answer) b.classList.add('correct');
    else if(btnAns === userAns) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedbackZone');
  fb.innerHTML = `
    <div class="feedback ${correct?'ok':'ng'}">
      <strong>${correct ? '○ 正解' : '× 不正解'}</strong>（正答：${q.answer ? '○' : '×'}）
      ${q.explanation ? `<div class="exp">${esc(q.explanation)}</div>` : ''}
    </div>
    <div class="btn-row"><button class="btn primary" id="nextBtn">次の問題へ</button></div>
  `;
  document.getElementById('nextBtn').onclick = nextQuestion;
}

function nextQuestion(){
  quizState.idx++;
  if(quizState.mode==='year'){ PROGRESS.yearIndex = quizState.idx; saveProgress(PROGRESS); }
  if(quizState.mode==='attack'){
    if(quizState.timeLeft<=0){ endAttack(); return; }
    if(quizState.idx >= quizState.pool.length){
      // 出題し尽くしたらシャッフルして続行（制限時間まで問題が尽きないように）
      quizState.pool = quizState.pool.slice().sort(()=>Math.random()-0.5);
      quizState.idx = 0;
    }
  }
  quizState.answered = false;
  renderQuiz();
}

/* ---------------- admin: list ---------------- */
function renderAdminList(){
  const sorted = QUESTIONS.slice().sort((a,b)=>a.year-b.year);
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← ホームへ</button>
      <div class="progress-pill">全${QUESTIONS.length}問</div>
    </div>
    <div class="card gold-left" style="margin-bottom:18px;">
      <div class="m-title serif" style="font-size:16px; margin-bottom:4px;">問題を管理する</div>
      <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.7;">
        1問ずつ編集するほか、参考サイトからコピーした文章をまとめて貼り付けて自動取り込みできます。
      </div>
    </div>
    <div class="btn-row" style="margin-top:0; margin-bottom:16px;">
      <button class="btn tape small" id="bulkImport">📋 まとめて貼り付けて取り込む</button>
      <button class="btn primary small" id="addQ">＋ 1問だけ追加</button>
      <button class="btn ghost small" id="resetQ">サンプルに戻す</button>
    </div>
    <div id="adminList"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ view='home'; renderHome(); };
  document.getElementById('addQ').onclick = ()=> renderAdminEdit(null);
  document.getElementById('bulkImport').onclick = ()=> renderBulkImport();
  document.getElementById('resetQ').onclick = async ()=>{
    if(confirm('編集内容をすべて破棄して、サンプル問題に戻しますか？')){
      QUESTIONS = SAMPLE_QUESTIONS.slice();
      await saveQuestions(QUESTIONS);
      toast('サンプル問題に戻しました');
      renderAdminList();
    }
  };

  const listEl = document.getElementById('adminList');
  if(sorted.length===0){
    listEl.innerHTML = `<div class="empty"><div class="big serif">問題がありません</div><div style="font-size:13px;">上のボタンから登録してください。</div></div>`;
    return;
  }
  sorted.forEach(q=>{
    const item = document.createElement('div');
    item.className = 'admin-list-item';
    item.innerHTML = `
      <div class="ai-ans ${q.answer?'maru':'batsu'}">${q.answer?'○':'×'}</div>
      <div class="ai-text">${esc(q.text.slice(0,44))}${q.text.length>44?'…':''}</div>
      <div class="ai-meta">${q.year}</div>
    `;
    item.addEventListener('click', ()=>renderAdminEdit(q.id));
    listEl.appendChild(item);
  });
}

/* ---------------- admin: edit / add single question ---------------- */
function renderAdminEdit(id){
  const isNew = id===null;
  const q = isNew ? { id:'q_'+Date.now().toString(36), year:new Date().getFullYear(), category:'', text:'', answer:true, explanation:'' }
                   : QUESTIONS.find(x=>x.id===id);

  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← 問題一覧へ</button>
      ${!isNew ? `<button class="danger-link" id="delQ">この問題を削除</button>` : ''}
    </div>
    <div class="card stake-left">
      <div class="field"><label>年度</label><input type="number" id="f_year" value="${q.year}"></div>
      <div class="field"><label>区分（任意）</label><input type="text" id="f_category" value="${esc(q.category||'')}" placeholder="例：午前の部"></div>
      <div class="field"><label>問題文</label><textarea id="f_text" rows="5">${esc(q.text)}</textarea></div>
      <div class="field">
        <label>正解</label>
        <div class="ox-toggle" id="oxToggle">
          <label class="${q.answer?'active-maru':''}"><input type="radio" name="f_answer" value="true" ${q.answer?'checked':''}> ○</label>
          <label class="${!q.answer?'active-batsu':''}"><input type="radio" name="f_answer" value="false" ${!q.answer?'checked':''}> ×</label>
        </div>
      </div>
      <div class="field"><label>解説（任意）</label><textarea id="f_exp" rows="3">${esc(q.explanation||'')}</textarea></div>
      <div class="btn-row">
        <button class="btn primary" id="saveQ">保存する</button>
        <button class="btn ghost" id="cancelQ">キャンセル</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=>renderAdminList();
  document.getElementById('cancelQ').onclick = ()=>renderAdminList();
  document.querySelectorAll('#oxToggle input').forEach(r=>{
    r.addEventListener('change', ()=>{
      document.querySelectorAll('#oxToggle label').forEach(l=>l.classList.remove('active-maru','active-batsu'));
      const label = r.closest('label');
      label.classList.add(r.value==='true' ? 'active-maru' : 'active-batsu');
    });
  });
  if(!isNew){
    document.getElementById('delQ').onclick = async ()=>{
      if(confirm('この問題を削除しますか？この操作は取り消せません。')){
        QUESTIONS = QUESTIONS.filter(x=>x.id!==id);
        delete PROGRESS.streaks[id];
        await saveQuestions(QUESTIONS); await saveProgress(PROGRESS);
        toast('削除しました');
        renderAdminList();
      }
    };
  }
  document.getElementById('saveQ').onclick = async ()=>{
    const year = parseInt(document.getElementById('f_year').value, 10) || new Date().getFullYear();
    const category = document.getElementById('f_category').value.trim();
    const text = document.getElementById('f_text').value.trim();
    const answerRadio = document.querySelector('input[name="f_answer"]:checked');
    const answer = answerRadio ? answerRadio.value === 'true' : true;
    const explanation = document.getElementById('f_exp').value.trim();
    if(!text){ toast('問題文を入力してください'); return; }

    const updated = { id:q.id, year, category, text, answer, explanation };
    if(isNew) QUESTIONS.push(updated);
    else QUESTIONS[QUESTIONS.findIndex(x=>x.id===id)] = updated;
    await saveQuestions(QUESTIONS);
    toast('保存しました');
    renderAdminList();
  };
}

/* ---------------- bulk import: parsing ----------------
   参考サイト（totikao-quiz）のページをスマホで「すべて選択→コピー」してそのまま
   貼り付けられるよう、ナビゲーションやフッターなどの定型文を自動で除去してから解析します。

   このサイトは1問（例：問1）が「肢 ア／イ／ウ／エ／オ」の5つの○×枝に分かれており、
   各枝ごとに「解答：○」のように解答が書かれています。まずこの書式を優先的に認識し、
   見つからない場合は「問1」「問2」等の番号や空行区切りで解析するフォールバックに回ります。
   自動認識できなかった問題は「要確認」として残るので、取り込み前に必ず確認してください。
------------------------------------------------------- */

// サイトのナビゲーション・フッターなどによくある定型文（このアプリ自身の文言も含む）を除去
const NOISE_LINE_PATTERNS = [
  /^(TOP|ホーム|トップ|トップへ|メニュー|戻る|次へ|一覧へ戻る|年度一覧へ)$/i,
  /^(年度順|復習|タイムアタック|年度別過去問を見る|続きから)モード?$/,
  /^次の問題（問\s?\d+）→$/, /^←?前の問題（問\s?\d+）$/,
  /の問題一覧へ$/,
  /^この問題からクイズを始める$/,
  /^出典[:：]/,
  /^JSONデータに解説・根拠の記載がないため/,
  /^(令和|平成)\d+年度土地家屋調査士試験の問\s?\d+です/,
  /^土地家屋調査士\s*(令和|平成)\d+年度\s*過去問・解答\s*問\s?\d+$/,
  /^(令和|平成)\d+年度・問\s?\d+$/,
  /^(令和|平成)\d+年度$/,
  /^問\s?\d+$/,
  /アクセス解析とプライバシー/, /プライバシーについて/,
  /法務省.{0,10}(帰属|著作権)/, /個人の学習支援を目的とした非公式/,
  /^以上$/,
  /^@\w+$/, /^[Xx]\s*\(旧Twitter\)$/, /^シェア$/, /^Tweet$/, /^Follow$/i,
  /^(進捗を読み込み中|読み込み中)[…\.]*$/,
  /^\d+\s*\/\s*\d+$/, // "3 / 45" のような進捗表示
  /^(正答|スコア|score)\s*[:：]?\s*\d+/i,
];
function isNoiseLine(line){
  return NOISE_LINE_PATTERNS.some(re=>re.test(line));
}

// 「令和7年度」→2025、「平成30年度」→2018 のように和暦を西暦へ変換
function detectYear(raw){
  let m = raw.match(/令和\s?(\d+)\s?年度?/);
  if(m) return 2018 + parseInt(m[1], 10);
  m = raw.match(/平成\s?(\d+)\s?年度?/);
  if(m) return 1988 + parseInt(m[1], 10);
  m = raw.match(/(20\d\d)\s?年度?/);
  if(m) return parseInt(m[1], 10);
  return new Date().getFullYear();
}
function detectDaimon(raw){
  const m = raw.match(/(?:^|\n)問\s?(\d+)\s*(?:\n|$)/);
  return m ? m[1] : '';
}

function preClean(raw){
  const lines = raw.split('\n').map(l=>l.trim());
  const cleaned = [];
  const seenNav = new Map(); // 短い行（ナビっぽい）が何度も出てきたら以降は除去
  const protectFromDedup = l => ansWordPattern.test(l) || lineIsAnswerOnly.test(l) || /^肢\s?[ア-ン]\s*$/.test(l) || idLinePattern.test(l);
  lines.forEach(line=>{
    if(!line) { cleaned.push(''); return; }
    if(isNoiseLine(line)) return;
    if(line.length <= 6 && !protectFromDedup(line)){
      const c = (seenNav.get(line)||0) + 1;
      seenNav.set(line, c);
      if(c >= 3) return; // 3回以上出てくる短い行はナビの可能性が高いので除去
    }
    cleaned.push(line);
  });
  return cleaned.join('\n').replace(/\n{3,}/g, '\n\n');
}

const ansWordPattern = /(正解|解答|答え)\s*[:：]?\s*(○|×|〇|X|x|✕|正しい|誤り|true|false)/i;
const lineIsAnswerOnly = /^(○|×|〇|X|x|✕)$/;
const idLinePattern = /^[RHS]?\s?\d+\s?-\s?\d+\s?-\s?[ア-ンA-Za-z]\s*$/; // 例: R7-1-ア

function normalizeAns(token){
  const t = token.trim().toLowerCase();
  if(['×','x','✕','誤り','false'].includes(t)) return false;
  return true; // ○/〇/正しい/true/デフォルト
}

function parseBulkText(rawInput){
  const year = detectYear(rawInput);
  const daimon = detectDaimon(rawInput);
  const raw = preClean(rawInput);

  // ---- パターンA：「肢 ア／イ／ウ／エ／オ」形式（totikao-quizの過去問ページ） ----
  const edaMarker = /^肢\s?([ア-ン])\s*$/;
  const rawLines = raw.split('\n').map(l=>l.trim());
  const edaIdxs = [];
  rawLines.forEach((l,i)=>{ if(edaMarker.test(l)) edaIdxs.push(i); });

  if(edaIdxs.length > 0){
    const results = [];
    edaIdxs.forEach((startIdx, n)=>{
      const endIdx = n+1 < edaIdxs.length ? edaIdxs[n+1] : rawLines.length;
      const eda = rawLines[startIdx].match(edaMarker)[1];
      const chunk = rawLines.slice(startIdx+1, endIdx).filter(Boolean);

      let idLabel = '';
      let answer = null;
      const bodyLines = [];
      chunk.forEach(line=>{
        if(!idLabel && idLinePattern.test(line)){ idLabel = line.replace(/\s*-\s*/g,'-').trim(); return; }
        if(answer===null){
          const m = line.match(ansWordPattern);
          if(m){ answer = normalizeAns(m[2]); return; }
          if(lineIsAnswerOnly.test(line)){ answer = normalizeAns(line); return; }
        }
        bodyLines.push(line);
      });
      const text = bodyLines.join('\n').trim();
      if(!text) return;
      results.push({
        key: 'imp_'+startIdx+'_'+Date.now().toString(36),
        year, category: idLabel || (daimon ? `問${daimon}-${eda}` : `肢${eda}`),
        text, answer: answer===null ? true : answer, explanation:'',
        needsCheck: answer===null
      });
    });
    if(results.length) return results;
  }

  // ---- パターンB：フォールバック（問n番号 or 空行区切り + 解答行） ----
  let blocks = raw.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  const qNumSplit = /\n(?=(問\s?\d+|第\s?\d+\s?問)\s)/;
  blocks = blocks.flatMap(b=>{
    const parts = b.split(qNumSplit).map(s=>s.trim()).filter(Boolean);
    return parts.length > 1 ? parts : [b];
  });

  const results = [];
  blocks.forEach((block, i)=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    let answer = null;
    let bodyLines = [];

    lines.forEach(line=>{
      if(answer===null){
        const m = line.match(ansWordPattern);
        if(m){
          answer = normalizeAns(m[2]);
          const stripped = line.replace(ansWordPattern, '').trim();
          if(stripped) bodyLines.push(stripped);
          return;
        }
        if(lineIsAnswerOnly.test(line)){
          answer = normalizeAns(line);
          return;
        }
      }
      bodyLines.push(line.replace(/^(問\s?\d+[\.．、:：]?|\(?\d+\)?[\.．、:：])\s*/, ''));
    });

    const text = bodyLines.join('\n').trim();
    if(!text) return;

    results.push({
      key: 'imp_'+i+'_'+Date.now().toString(36),
      year, category:'', text,
      answer: answer===null ? true : answer, explanation:'',
      needsCheck: answer===null
    });
  });
  return results;
}

let PARSED_BUFFER = [];

function renderBulkImport(){
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backBtn">← 問題一覧へ</button>
    </div>
    <div class="card tape-left">
      <div class="m-title serif" style="font-size:16px; margin-bottom:6px;">まとめて貼り付けて取り込む</div>
      <div class="hint">
        スマホの場合：参考サイトの過去問ページを開き、文章を長押し→「すべて選択」→コピーして、下に貼り付けてください。ナビやフッターの余計な文字は自動である程度取り除きます。<br><br>
        ・「問1」「問2」のような番号や、空行の位置で自動的に1問ずつ分割します<br>
        ・「正解：○」「解答:×」のように解答が書かれていれば自動で読み取ります<br>
        ・自動で読み取れなかった問題は「要確認」と表示されるので、次の画面で○×を選び直してください
      </div>
    </div>
    <div class="import-box">
      <textarea id="bulkText" placeholder="ページ全体をそのまま貼り付けてOKです。例）
問1　表示に関する登記は、登記官が職権で行うことができる場合がある。
正解：○

問2　土地の分筆登記の申請には、地積測量図を提供する必要はない。
解答：×
"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn tape" id="parseBtn">解析してプレビュー</button>
      <button class="btn ghost" id="cancelBulk">キャンセル</button>
    </div>
    <div id="previewZone"></div>
  `;
  document.getElementById('backBtn').onclick = ()=>renderAdminList();
  document.getElementById('cancelBulk').onclick = ()=>renderAdminList();
  document.getElementById('parseBtn').onclick = ()=>{
    const raw = document.getElementById('bulkText').value;
    if(!raw.trim()){ toast('テキストを貼り付けてください'); return; }
    PARSED_BUFFER = parseBulkText(raw);
    if(PARSED_BUFFER.length===0){ toast('問題を認識できませんでした。改行の入れ方を確認してください。'); return; }
    renderBulkPreview();
  };
}

function renderBulkPreview(){
  const zone = document.getElementById('previewZone');
  const checkCount = PARSED_BUFFER.filter(p=>p.needsCheck).length;
  zone.innerHTML = `
    <div class="card gold-left" style="margin-top:20px;">
      <div class="m-title serif" style="font-size:15px;">${PARSED_BUFFER.length}問を検出しました${checkCount? `（うち要確認 ${checkCount}問）`:''}</div>
      <div class="hint">内容と○×・年度を確認し、必要なら修正してから「この内容で取り込む」を押してください。不要な問題は「除外」で取り込みから外せます。</div>
    </div>
    <div id="parsedList"></div>
    <div class="btn-row">
      <button class="btn primary" id="commitBtn">この内容で取り込む</button>
      <button class="btn ghost" id="backParse">貼り付けに戻る</button>
    </div>
  `;
  document.getElementById('backParse').onclick = ()=>renderBulkImport();

  const listEl = document.getElementById('parsedList');
  PARSED_BUFFER.forEach((p, idx)=>{
    const div = document.createElement('div');
    div.className = 'parsed-item';
    div.dataset.key = p.key;
    div.innerHTML = `
      ${p.needsCheck ? `<div class="p-flag">⚠ ○×を自動判定できませんでした。確認してください</div>` : ''}
      <div class="p-head">
        <input type="text" value="${esc(p.category||'')}" data-f="category" placeholder="区分（例：R7-1-ア）" style="flex:1; min-width:0;">
        <input type="number" value="${p.year}" data-f="year" style="width:80px;">
        <select data-f="answer">
          <option value="true" ${p.answer?'selected':''}>○（正しい）</option>
          <option value="false" ${!p.answer?'selected':''}>×（誤り）</option>
        </select>
        <button class="p-remove" data-remove>除外</button>
      </div>
      <textarea data-f="text">${esc(p.text)}</textarea>
    `;
    listEl.appendChild(div);

    div.querySelector('[data-remove]').addEventListener('click', ()=>{
      PARSED_BUFFER = PARSED_BUFFER.filter(x=>x.key!==p.key);
      renderBulkPreview();
    });
  });

  document.getElementById('commitBtn').onclick = async ()=>{
    document.querySelectorAll('.parsed-item').forEach(div=>{
      const key = div.dataset.key;
      const item = PARSED_BUFFER.find(x=>x.key===key);
      if(!item) return;
      item.category = div.querySelector('[data-f="category"]').value.trim();
      item.year = parseInt(div.querySelector('[data-f="year"]').value,10) || item.year;
      item.answer = div.querySelector('[data-f="answer"]').value === 'true';
      item.text = div.querySelector('[data-f="text"]').value.trim();
    });
    const valid = PARSED_BUFFER.filter(p=>p.text);
    if(valid.length===0){ toast('取り込める問題がありません'); return; }
    valid.forEach(p=>{
      QUESTIONS.push({ id:'q_'+Math.random().toString(36).slice(2)+Date.now().toString(36), year:p.year, category:p.category||'', text:p.text, answer:p.answer, explanation:'' });
    });
    await saveQuestions(QUESTIONS);
    toast(`${valid.length}問を取り込みました`);
    PARSED_BUFFER = [];
    renderAdminList();
  };
}

/* ---------------- boot ---------------- */
(async function init(){
  app.innerHTML = `<div class="empty">読み込み中…</div>`;
  QUESTIONS = await loadQuestions();
  PROGRESS = await loadProgress();
  renderHome();
})();
</script>
